---
# k3s-agent.yml — Add agent nodes to an existing cluster
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/k3s-agent.yml
- name: Base setup for agent nodes
  hosts: k3s_agents
  become: true
  roles:
    - common

- name: Retrieve server token
  hosts: k3s_servers
  become: true
  tasks:
    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_raw
      no_log: true

    - name: Set node token fact
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"
      no_log: true

- name: Install k3s agent
  hosts: k3s_agents
  become: true
  vars:
    # Agents join on the server's CLUSTER address, which is not always the one
    # Ansible reaches it on over SSH (a public IP, a bastion, a tunnel). First
    # match wins: k3s_server_join_address, then k3s_node_ip, set on the server
    # host in the inventory; ansible_host only as the last resort.
    k3s_server_url: >-
      {%- set srv = hostvars[groups['k3s_servers'][0]] -%}
      https://{{ srv.k3s_server_join_address | default(srv.k3s_node_ip | default(srv.ansible_host)) }}:6443
    k3s_node_token: "{{ hostvars[groups['k3s_servers'][0]].k3s_node_token }}"
  roles:
    - k3s_agent

# Must stay the LAST play: the firewall comes up only once every role has
# registered its rules. See roles/ufw_enable/tasks/main.yml.
- name: Enable the firewall on the agent nodes
  hosts: k3s_agents
  become: true
  roles:
    - ufw_enable
