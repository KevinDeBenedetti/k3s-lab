---
# k3s-server.yml — Setup server node only
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/k3s-server.yml
- name: Base setup for server node
  hosts: k3s_servers
  become: true
  roles:
    - common

- name: Install k3s server
  hosts: k3s_servers
  become: true
  roles:
    - k3s_server
    - wireguard

# Must stay the LAST play: the firewall comes up only once every role has
# registered its rules. See roles/ufw_enable/tasks/main.yml.
- name: Enable the firewall on the server node
  hosts: k3s_servers
  become: true
  roles:
    - ufw_enable
