---
# common role — base VPS setup for all k3s nodes
# Idempotent: safe to run multiple times

# Packages to install
common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - open-iscsi
  - nfs-common
  - jq
  - unattended-upgrades

# Kernel modules required by k3s
common_kernel_modules:
  - overlay
  - br_netfilter

# Sysctl settings for Kubernetes networking and security hardening
common_sysctl:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  # Reverse path filtering — drop packets with spoofed source addresses
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  # SYN flood protection
  net.ipv4.tcp_syncookies: 1
  # Martian logging stays OFF on k3s nodes. Pod-to-pod traffic crossing the
  # flannel/CNI bridges is routinely "martian" from the host's point of view, so
  # this logs continuously and floods the kernel ring buffer — it makes the
  # provider's rescue console unreadable at the exact moment it is the only way
  # in. Set explicitly to 0 (rather than dropped from the dict) so nodes already
  # provisioned with it enabled get it turned back off.
  net.ipv4.conf.all.log_martians: 0
  net.ipv4.conf.default.log_martians: 0
  # Disable ICMP redirects (prevent MITM)
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  # Ignore ICMP broadcast requests
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  # inotify limits — k3s/containerd + kubelet + many pods blow past the kernel
  # default of 128 instances, yielding "Failed to allocate directory watch:
  # Too many open files" (systemd) and can stall pods. Raise for a busy node.
  fs.inotify.max_user_instances: 1024
  fs.inotify.max_user_watches: 524288

# Disable swap
common_disable_swap: true

# Dynamic MOTD — server overview (resources, apt, k3s health) on SSH login
common_motd_enabled: true

# UFW defaults
#
# k3s_lab_ufw_enabled is the SINGLE switch for every UFW task in this repo
# (common, k3s_server, k3s_agent, wireguard, ufw_enable). It is redeclared with
# the same default in each of those roles, because role defaults are only in
# scope while that role runs — site.yml applies them across separate plays.
# Override it once in group_vars/all to turn firewall management off wholesale.
# `common_ufw_enabled` is the former, common-only name, still honoured.
k3s_lab_ufw_enabled: "{{ common_ufw_enabled | default(true) }}"
# `ufw` shells out to iptables/nft, which races k3s rewriting the same nf_tables
# ruleset (it reconciles on its own schedule). A losing call fails with a lock
# or "resource busy" error; retrying clears it. Same defaults in every role.
k3s_lab_ufw_retries: 5
k3s_lab_ufw_delay: 3
common_ufw_default_policy: deny
common_ufw_allow_ssh: true
common_ssh_port: 22
