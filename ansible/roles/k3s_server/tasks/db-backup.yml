---
# Install a systemd timer that snapshots the k3s SQLite datastore locally.
# See templates/k3s-db-backup.sh.j2 for rationale. sqlite3 is installed by
# kine-vacuum.yml, imported just before this file.

- name: Deploy k3s-db-backup script
  ansible.builtin.template:
    src: k3s-db-backup.sh.j2
    dest: /usr/local/sbin/k3s-db-backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Deploy k3s-db-backup systemd service
  ansible.builtin.template:
    src: k3s-db-backup.service.j2
    dest: /etc/systemd/system/k3s-db-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy k3s-db-backup systemd timer
  ansible.builtin.template:
    src: k3s-db-backup.timer.j2
    dest: /etc/systemd/system/k3s-db-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start k3s-db-backup timer
  ansible.builtin.systemd:
    name: k3s-db-backup.timer
    enabled: "{{ k3s_db_backup_enabled }}"
    state: "{{ 'started' if k3s_db_backup_enabled else 'stopped' }}"
    daemon_reload: true
