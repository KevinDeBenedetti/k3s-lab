---
# k3s_server role defaults

k3s_version: "v1.32.13+k3s1"

# Integrity pin for the get.k3s.io installer script, which is downloaded and
# then executed as root on every node. Empty = no verification at all, which is
# what this was until 2026-08-06: the hook existed and was documented, so it was
# off everywhere. An unverified root-executed download is the one failure in
# this role that is not recoverable.
#
# Computed 2026-08-06 (38620 bytes, digest confirmed stable across two fetches):
#   curl -fsSL https://get.k3s.io | shasum -a 256
#
# ⚠️ This pins the *installer script*, which upstream revises independently of
# k3s releases — not the k3s version (that is `k3s_version`). When Rancher edits
# the script the download starts failing with a checksum mismatch: that is the
# pin working, not a bug. Re-run the command above, read the diff if you care to,
# and update the digest and the date on this line together.
k3s_installer_checksum: "sha256:ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b"

# Networking
k3s_pod_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_cluster_dns: "10.43.0.10"

# Flannel backend: vxlan (default) or wireguard-native
k3s_flannel_backend: vxlan

# Node IP used for inter-node communication (private network)
# Override with the node's private IP from Hetzner network
k3s_node_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

# Disable bundled components (managed externally via Helm/ArgoCD)
k3s_disable:
  - traefik
  - servicelb

# Extra args appended to k3s server install
# Includes secrets encryption at rest, API server audit logging, kubelet hardening
#
# IMPORTANT: --secrets-encryption must remain enabled. Once the cluster is
# initialized with aescbc encryption, removing this flag switches k3s to the
# identity provider and all subsequent reads of encrypted secrets fail with
# "identity transformer tried to read encrypted data".
k3s_extra_server_args: >-
  --secrets-encryption=true
  --kube-apiserver-arg=audit-log-path=/var/log/k3s-audit.log
  --kube-apiserver-arg=audit-log-maxage=30
  --kube-apiserver-arg=audit-log-maxbackup=10
  --kube-apiserver-arg=audit-log-maxsize=100
  --protect-kernel-defaults

# Firewall. k3s_lab_ufw_enabled is the single switch for every UFW task in the
# repo; it is redeclared here (same default as the common role) because role
# defaults are only in scope while their own role runs, and site.yml applies
# common and k3s_server in separate plays. See roles/common/defaults/main.yml.
k3s_lab_ufw_enabled: "{{ common_ufw_enabled | default(true) }}"
k3s_lab_ufw_retries: 5
k3s_lab_ufw_delay: 3

# Ports to open for agent communication
k3s_ufw_allow_from: "10.0.0.0/16"

# Extra CIDRs (besides k3s_ufw_allow_from) allowed to reach the API server on
# 6443. Use for VPN clients so kubectl works from a laptop over the tunnel,
# e.g. ["10.8.0.0/24"] for the WireGuard subnet. Empty = no extra access.
k3s_api_extra_allow_from: []

# Extra Subject Alternative Names added to the API server serving cert via a
# /etc/rancher/k3s/config.yaml.d drop-in. Applied by restarting k3s (no
# reinstall needed). Required when kubectl reaches the API on an address k3s
# does not auto-detect, e.g. the WireGuard tunnel IP ["10.8.0.1"]. Empty = none.
k3s_tls_sans: []

# =============================================================================
# kine-vacuum — periodic SQLite VACUUM of the kine datastore
# =============================================================================
# kine (k3s's default datastore) auto-compacts rows but SQLite never returns
# freelist space to the OS without VACUUM. On busy clusters `state.db` can
# grow to tens of GiB while holding only a few thousand live rows.
kine_vacuum_enabled: true

# Path to the kine database directory
kine_vacuum_db_dir: /var/lib/rancher/k3s/server/db

# Only VACUUM if state.db exceeds this size (bytes). Default: 2 GiB.
# Below this threshold the task is a no-op.
kine_vacuum_threshold_bytes: 2147483648

# systemd OnCalendar expression. Default: 1st of each month at 03:30.
kine_vacuum_schedule: "*-*-01 03:30:00"

# Randomize actual run within this window (seconds). Default: 1h.
kine_vacuum_randomized_delay: 3600

# k3s systemd unit name (override to `k3s-agent.service` or similar if needed)
kine_vacuum_k3s_service: k3s.service
