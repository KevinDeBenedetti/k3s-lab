# =============================================================================
# taskfiles/ssh.yml — SSH access to cluster nodes
#
# Namespace: ssh
# Usage (standalone):  task ssh:server
# Usage (included):    includes: ssh: taskfile: <path-to-k3s-lab>/taskfiles/ssh.yml
#
# Required env (from .env):
#   SERVER_IP    address of the server node (AGENT_IP for ssh:agent)
#
# Optional env (applied by scripts/ssh-node.sh):
#   SSH_USER     SSH username (default: your local $USER)
#   SSH_PORT     SSH port (default: 22)
#   SSH_KEY      path to the private key (default: ssh's own)
# =============================================================================
version: '3'

tasks:
  server:
    desc: Open SSH shell on server node
    preconditions:
      - sh: test -n "$SERVER_IP"
        msg: "SERVER_IP is not set — add it to .env"
    cmds:
      - bash {{.TASKFILE_DIR}}/../scripts/ssh-node.sh "$SERVER_IP"

  agent:
    desc: Open SSH shell on agent node
    preconditions:
      - sh: test -n "$AGENT_IP"
        msg: "AGENT_IP is not set — add it to .env"
    cmds:
      - bash {{.TASKFILE_DIR}}/../scripts/ssh-node.sh "$AGENT_IP"

  known-hosts-reset:
    desc: Remove stale known_hosts entries (run after a node reinstall)
    cmds:
      - cmd: '[ -z "$SERVER_IP" ] || ssh-keygen -R "$SERVER_IP" 2>/dev/null; true'
        ignore_error: true
      - cmd: '[ -z "$AGENT_IP" ] || ssh-keygen -R "$AGENT_IP" 2>/dev/null; true'
        ignore_error: true
