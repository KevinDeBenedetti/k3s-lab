# =============================================================================
# taskfiles/vault.yml — HashiCorp Vault + External Secrets Operator
#
# Namespace: vault
# Usage (standalone):  task vault:status
# Usage (included):    includes: vault: taskfile: <path-to-k3s-lab>/taskfiles/vault.yml
#
# The scripts read their configuration from .env (lib/script-init.sh) or the
# environment, and their defaults live in lib/vault.sh only — the tasks pass
# nothing through. Usual .env entries:
#   KUBECONFIG_CONTEXT    kubectl context
#   VAULT_ROOT_TOKEN      for configure/seed (init prints it once)
#   VAULT_UNSEAL_KEY_1…n  for unseal (asked for on the terminal when unset)
#   OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_ISSUER_URL, VAULT_DOMAIN,
#   ADMIN_EMAIL           all five, or none, for Vault's OIDC login
# Optional: VAULT_NAMESPACE (vault), VAULT_POD (vault-0), VAULT_POLICY_DIR,
# VAULT_KEY_SHARES (3), VAULT_KEY_THRESHOLD (2) — see lib/vault.sh.
#
# Vars (override via includes vars:):
#   VAULT_CONFIGURE_SCRIPT   default: <k3s-lab>/scripts/vault-configure.sh
# =============================================================================
version: '3'

vars:
  # Used by `status` only, which runs kubectl itself. Task resolves them from
  # the environment / .env too, so they follow the same values as the scripts.
  VAULT_POD: '{{.VAULT_POD | default "vault-0"}}'
  VAULT_NAMESPACE: '{{.VAULT_NAMESPACE | default "vault"}}'
  VAULT_CONFIGURE_SCRIPT: '{{.VAULT_CONFIGURE_SCRIPT | default (printf "%s/../scripts/vault-configure.sh" .TASKFILE_DIR)}}'

tasks:
  init:
    desc: Initialize (or unseal) Vault, then configure it
    summary: |
      Runs scripts/vault-init.sh:
        1. Wait for the Vault pod to be Ready
        2. vault operator init (3 key shares, threshold 2) — or unseal an
           already initialised Vault
        3. Configure: KV v2 at secret/, Kubernetes auth, policies from
           vault/policies/, the External Secrets role, and OIDC when all of
           its five variables are set

      Save the unseal keys and the root token — they will not be shown again.
    cmds:
      - bash {{.TASKFILE_DIR}}/../scripts/vault-init.sh

  unseal:
    desc: Unseal Vault after a pod restart (VAULT_UNSEAL_KEY_1, _2, … from .env, or asked for)
    cmds:
      - bash {{.TASKFILE_DIR}}/../scripts/vault-unseal.sh

  configure:
    desc: (Re)apply Vault engines, auth methods, policies and roles (idempotent)
    cmds:
      - bash {{.VAULT_CONFIGURE_SCRIPT}}

  seed:
    desc: Seed core secrets into Vault (OIDC, Grafana admin/oauth, Traefik dashboard)
    summary: |
      Reads from .env and seeds the following Vault KV paths:
        secret/argocd/oidc         — OIDC_CLIENT_ID, OIDC_CLIENT_SECRET
        secret/grafana/admin       — admin username + password
        secret/grafana/oauth       — full Grafana Generic OAuth config
        secret/traefik/dashboard   — htpasswd users string

      Values that are not set are skipped. Needs VAULT_ROOT_TOKEN.
    cmds:
      - bash {{.TASKFILE_DIR}}/../scripts/vault-seed.sh

  status:
    desc: Show Vault seal status, ESO sync status, and managed secrets
    cmds:
      - cmd: 'echo ""'
        silent: true
      - cmd: 'printf "\033[0;36m── Vault ──────────────────────────────────────────────────────\033[0m\n"'
        silent: true
      - cmd: >-
          kubectl --context $KUBECONFIG_CONTEXT
          exec -n {{.VAULT_NAMESPACE}} {{.VAULT_POD}} --
          env VAULT_SKIP_VERIFY=true vault status 2>/dev/null
          || echo "  ❌ Vault pod not reachable"
        ignore_error: true
      - cmd: 'echo ""'
        silent: true
      - cmd: 'printf "\033[0;36m── External Secrets ──────────────────────────────────────────\033[0m\n"'
        silent: true
      - cmd: >-
          kubectl --context $KUBECONFIG_CONTEXT get externalsecrets -A
          -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[0].status,REFRESH:.status.refreshTime'
          2>/dev/null || echo "  ❌ ESO not installed"
        ignore_error: true
      - cmd: 'echo ""'
        silent: true
      - cmd: 'printf "\033[0;36m── ClusterSecretStore ────────────────────────────────────────\033[0m\n"'
        silent: true
      - cmd: >-
          kubectl --context $KUBECONFIG_CONTEXT get clustersecretstore
          -o custom-columns='NAME:.metadata.name,READY:.status.conditions[0].status'
          2>/dev/null || echo "  (none)"
        ignore_error: true
