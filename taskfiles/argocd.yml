# =============================================================================
# taskfiles/argocd.yml — ArgoCD GitOps Continuous Delivery
#
# Namespace: argocd
# Usage (standalone):  task argocd:status
# Usage (included):    includes: argocd: taskfile: <path-to-k3s-lab>/taskfiles/argocd.yml
#
# Required env (from .env):
#   KUBECONFIG_CONTEXT   kubectl context of the target cluster
#   ARGOCD_DOMAIN        e.g. argocd.example.com
# Optional env:
#   SERVER_IP            only used in the post-install DNS hint
#
# Vars (override via includes vars:):
#   ARGOCD_VALUES_FILE   your per-cluster values, layered on the chart's
#                        defaults; path relative to the directory task runs
#                        from. Default: none
#
# The chart installed is this checkout's charts/platform-argocd, so the
# argo-cd version is the one pinned in its Chart.yaml (bumped with the rest of
# the repository), never a separate variable that can drift from it.
# =============================================================================
version: '3'

vars:
  ARGOCD_CHART_DIR: '{{.TASKFILE_DIR}}/../charts/platform-argocd'
  ARGOCD_VALUES_FILE: '{{.ARGOCD_VALUES_FILE | default ""}}'
  ARGOCD_REPO_SECRET_NAME: '{{.ARGOCD_REPO_SECRET_NAME | default "argocd-repo"}}'

tasks:
  deploy:
    desc: Deploy ArgoCD (charts/platform-argocd) via Helm — run once after bootstrap
    preconditions:
      - sh: test -n "$KUBECONFIG_CONTEXT"
        msg: "KUBECONFIG_CONTEXT is not set — add it to .env"
      - sh: test -n "$ARGOCD_DOMAIN"
        msg: "ARGOCD_DOMAIN is not set — add it to .env"
      - sh: test -z "{{.ARGOCD_VALUES_FILE}}" || test -f "{{.ARGOCD_VALUES_FILE}}"
        msg: "ARGOCD_VALUES_FILE not found: {{.ARGOCD_VALUES_FILE}}"
    cmds:
      # The chart's own dependency (upstream argo-cd) at the version pinned in
      # its Chart.lock.
      - helm dependency build "{{.ARGOCD_CHART_DIR}}"
      # Release `argocd` renders the same `argocd-*` resource names as the
      # upstream chart installed under that release name, so an install made
      # with `argo/argo-cd` upgrades in place.
      - |
        helm upgrade --install argocd "{{.ARGOCD_CHART_DIR}}" \
          --kube-context "$KUBECONFIG_CONTEXT" \
          --namespace argocd \
          --create-namespace \
          {{if .ARGOCD_VALUES_FILE}}--values "{{.ARGOCD_VALUES_FILE}}" {{end}}\
          --set "argo-cd.global.domain=$ARGOCD_DOMAIN" \
          --set "argo-cd.configs.cm.url=https://$ARGOCD_DOMAIN" \
          --wait \
          --timeout 300s
      - cmd: |
          echo ""
          echo "  UI:       https://$ARGOCD_DOMAIN"
          echo "  User:     admin"
          echo "  Password: task argocd:password"
          echo ""
          echo "Next steps:"
          echo "  1. Add DNS: $ARGOCD_DOMAIN → ${SERVER_IP:-<your ingress IP>}"
          echo "  2. task argocd:add-repo ARGOCD_REPO_URL=git@github.com:<you>/<config-repo>.git GITHUB_DEPLOY_KEY=~/.ssh/deploy_key"
          echo "  3. Apply your AppProjects and root Application (or ApplicationSets) from your config repo"
          echo "  4. Add a GitHub webhook: https://$ARGOCD_DOMAIN/api/webhook"
        silent: true

  add-repo:
    desc: Register a Git repo in ArgoCD via SSH deploy key
    preconditions:
      - sh: test -n "$ARGOCD_REPO_URL"
        msg: "ARGOCD_REPO_URL is not set"
      - sh: test -n "$GITHUB_DEPLOY_KEY"
        msg: "GITHUB_DEPLOY_KEY is not set"
      - sh: test -f "$GITHUB_DEPLOY_KEY"
        msg: "GITHUB_DEPLOY_KEY file not found: $GITHUB_DEPLOY_KEY"
    cmds:
      - |
        kubectl --context $KUBECONFIG_CONTEXT \
          create secret generic {{.ARGOCD_REPO_SECRET_NAME}} \
          --from-literal=type=git \
          --from-literal=url="$ARGOCD_REPO_URL" \
          --from-file=sshPrivateKey="$GITHUB_DEPLOY_KEY" \
          -n argocd \
          --dry-run=client -o yaml \
        | kubectl --context $KUBECONFIG_CONTEXT apply -f -
      - |
        kubectl --context $KUBECONFIG_CONTEXT label secret {{.ARGOCD_REPO_SECRET_NAME}} \
          -n argocd argocd.argoproj.io/secret-type=repository --overwrite

  status:
    desc: Show ArgoCD app sync and health status
    cmds:
      - cmd: 'printf "\033[0;36m── ArgoCD Applications ─────────────────────────────────────────\033[0m\n"'
        silent: true
      - cmd: >-
          kubectl --context $KUBECONFIG_CONTEXT get applications -n argocd
          -o custom-columns='APP:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status'
          2>/dev/null || echo "  ❌ ArgoCD not reachable"
        ignore_error: true

  password:
    desc: Print the initial ArgoCD admin password
    cmds:
      - cmd: 'printf "\033[1;33m⚠️  Delete after first login: task argocd:delete-initial-secret\033[0m\n"'
        silent: true
      - cmd: >-
          kubectl --context $KUBECONFIG_CONTEXT -n argocd get secret argocd-initial-admin-secret
          -o jsonpath='{.data.password}' 2>/dev/null | base64 -d && echo
          || echo "✅ argocd-initial-admin-secret already deleted"
        ignore_error: true

  delete-initial-secret:
    desc: Delete argocd-initial-admin-secret (run after first OIDC login)
    cmds:
      - kubectl --context $KUBECONFIG_CONTEXT -n argocd delete secret argocd-initial-admin-secret --ignore-not-found

  disable-admin:
    desc: Disable ArgoCD local admin user (safe once OIDC is confirmed working)
    prompt: "This disables the local admin account. Ensure OIDC login works first. Continue?"
    cmds:
      - |
        kubectl --context $KUBECONFIG_CONTEXT -n argocd patch configmap argocd-cm \
          --type=merge -p '{"data":{"admin.enabled":"false"}}'
      - cmd: |
          printf "\033[1;33m⚠️  To re-enable admin: kubectl -n argocd patch cm argocd-cm --type=merge -p '{\"data\":{\"admin.enabled\":\"true\"}}'\033[0m\n"
        silent: true
