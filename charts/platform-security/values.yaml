# Enable/disable individual security tools
falco:
  enabled: true
  fullnameOverride: falco
  driver:
    kind: modern_ebpf
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

falcosidekick:
  enabled: false
  config:
    webhook:
      address: ""       # override in infra-private (e.g. Slack, PagerDuty URL)
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

tetragon:
  enabled: true
  fullnameOverride: tetragon
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

trivy-operator:
  enabled: true
  fullnameOverride: trivy-operator
  operator:
    scannerReportTTL: "24h"
    backgroundScanInterval: "24h"
  trivy:
    ignoreUnfixed: true
  nodeCollector:
    enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

kyverno:
  enabled: true
  fullnameOverride: kyverno
  # Admission controller configuration
  admissionController:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi
  # Background controller configuration (applies policies to existing resources)
  backgroundController:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # Cleanup controller configuration (manages policy reports and resources)
  cleanupController:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Reports controller configuration (generates policy reports)
  reportsController:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # Metrics and monitoring
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true       # Creates ServiceMonitor for Prometheus Operator
      interval: 30s
      additionalLabels:
        release: prometheus  # Match Prometheus selector
  # Generate events for policy violations
  generateSuccessEvents: false  # Only generate events for failures to reduce noise

# =============================================================================
# Kyverno ClusterPolicies shipped by this chart (templates/kyverno-policies/)
#
# Separate from `kyverno.enabled` on purpose: the engine and the policies it
# evaluates cannot always be installed in the same Helm release.
#
# Kyverno delivers its CRDs through a `crds` subchart whose manifests live in
# `templates/`, not in a `crds/` directory — a deliberate upstream choice, since
# Helm never upgrades what it finds in `crds/`. But Helm builds and validates
# *every* rendered manifest against the API server before applying any of them,
# so on a cluster where the Kyverno CRDs do not exist yet, these ClusterPolicies
# fail the build:
#
#   no matches for kind "ClusterPolicy" in version "kyverno.io/v1"
#   ensure CRDs are installed first
#
# Upstream hits the same wall and answers it the same way: `kyverno` and
# `kyverno-policies` are two separate charts.
#
# Default `true` — on a cluster that already has the CRDs (a re-install, an
# upgrade, or an ArgoCD sync, which retries until they exist) the policies must
# ship with the chart; a security chart that silently enforces nothing is worse
# than one that fails loudly. Set to `false` for the first install on a blank
# cluster, then re-enable with `helm upgrade`. The platform-deployment umbrella
# does exactly that — see its values.yaml.
# =============================================================================
kyvernoPolicies:
  enabled: true
