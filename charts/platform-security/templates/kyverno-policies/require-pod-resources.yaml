{{- if and .Values.kyverno.enabled .Values.kyvernoPolicies.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-pod-resources
  annotations:
    policies.kyverno.io/title: Require Pod Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requiring resource limits prevents resource exhaustion and improves cluster stability.
      This policy ensures all containers and init containers define CPU and
      memory requests and a memory limit. A CPU limit is optional: a memory
      limit protects the node (the container is killed), a CPU limit only
      throttles, and on a small node throttling a proxy or a backup burst hurts
      more than it protects.
# initContainers too: an init container counts in the pod's effective request
# (the max of the init containers vs the sum of the app containers). NOT
# ephemeralContainers: Kubernetes forbids `resources` on them, so every
# debug container would be refused.
spec:
  validationActions: [{{ include "platform-security.validationAction" . }}]
  evaluation:
    background:
      enabled: true
  # Kyverno generates this policy's checks for the Pod controllers listed
  # here. Its default list adds ReplicaSets: every Deployment rollout keeps
  # old ReplicaSets at zero replicas, whose policy reports repeat the
  # Deployment's failure until the next rollout.
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, statefulsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
            - argocd
            - cert-manager
            - external-secrets
            - vault
  validations:
    - expression: >-
        (object.spec.containers +
         (has(object.spec.initContainers) ? object.spec.initContainers : [])).all(c,
          has(c.resources) && has(c.resources.requests) &&
          has(c.resources.requests.cpu) && has(c.resources.requests.memory) &&
          has(c.resources.limits) && has(c.resources.limits.memory))
      message: "All containers must define CPU and memory requests and a memory limit (a CPU limit is optional)."
{{- end }}
