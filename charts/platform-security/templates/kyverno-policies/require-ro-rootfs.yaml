{{- if and .Values.kyverno.enabled .Values.kyvernoPolicies.enabled }}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ro-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Read-only root filesystem prevents malicious actors from writing to the container
      filesystem. This policy requires readOnlyRootFilesystem: true.
spec:
  background: true
  rules:
    - name: readonly-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - vault
                - monitoring
                - external-secrets
                - cert-manager
                - ingress
                # ARC runner pods: the runner writes its work dir and the
                # Kaniko init container copies its executor. Replaces infra's
                # PolicyException (2026-08-17). Added here and in restrict-capabilities
                # ONLY — the 6 policies keep distinct lists on purpose.
                - ci
      validate:
        failureAction: {{ include "platform-security.failureAction" . }}
        message: "Containers must use read-only root filesystem (securityContext.readOnlyRootFilesystem: true)."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
{{- end }}
