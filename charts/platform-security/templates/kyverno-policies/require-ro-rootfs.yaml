{{- if and .Values.kyverno.enabled .Values.kyvernoPolicies.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-ro-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Read-only root filesystem prevents malicious actors from writing to the container
      filesystem. This policy requires readOnlyRootFilesystem: true.
spec:
  validationActions: [{{ include "platform-security.validationAction" . }}]
  evaluation:
    background:
      enabled: true
  # Kyverno generates this policy's checks for the Pod controllers listed
  # here. Its default list adds ReplicaSets: every Deployment rollout keeps
  # old ReplicaSets at zero replicas, whose policy reports repeat the
  # Deployment's failure until the next rollout.
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, statefulsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
            - argocd
            - vault
            - monitoring
            - external-secrets
            - cert-manager
            - ingress
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem == true)
      message: "Containers must use read-only root filesystem (securityContext.readOnlyRootFilesystem: true)."
{{- end }}
