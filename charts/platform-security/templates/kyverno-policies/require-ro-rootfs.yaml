{{- if and .Values.kyverno.enabled .Values.kyvernoPolicies.enabled }}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ro-rootfs
  annotations:
    # Kyverno auto-generates this policy's rules for the Pod controllers listed
    # here. Its default list adds ReplicaSet and ReplicationController: every
    # Deployment rollout keeps old ReplicaSets at zero replicas, whose policy
    # reports repeat the Deployment's failure until the next rollout.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet,Job,CronJob
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Read-only root filesystem prevents malicious actors from writing to the container
      filesystem. This policy requires readOnlyRootFilesystem: true.
spec:
  background: true
  rules:
    - name: readonly-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - vault
                - monitoring
                - external-secrets
                - cert-manager
                - ingress
      validate:
        failureAction: {{ include "platform-security.failureAction" . }}
        message: "Containers must use read-only root filesystem (securityContext.readOnlyRootFilesystem: true)."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
{{- end }}
