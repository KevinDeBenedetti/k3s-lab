{{- if and .Values.kyverno.enabled .Values.kyvernoPolicies.enabled }}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-capabilities
  annotations:
    policies.kyverno.io/title: Restrict Linux Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Linux capabilities provide fine-grained privileges. This policy requires
      dropping ALL capabilities and only allows adding NET_BIND_SERVICE if needed.
      Aligns with Pod Security Standards restricted profile.
spec:
  background: true
  rules:
    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - vault
                - ingress
                - cert-manager
                - monitoring
                # ARC runner pods: the runner writes its work dir and the
                # Kaniko init container copies its executor. Replaces infra's
                # PolicyException (2026-08-17). Added here and in require-ro-rootfs
                # ONLY — the 6 policies keep distinct lists on purpose.
                - ci
      validate:
        failureAction: {{ include "platform-security.failureAction" . }}
        message: "Containers must drop ALL capabilities and may only add NET_BIND_SERVICE."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
                    =(add):
                      - NET_BIND_SERVICE
{{- end }}
