{{- if and .Values.kyverno.enabled .Values.kyvernoPolicies.enabled }}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    # Kyverno auto-generates this policy's rules for the Pod controllers listed
    # here. Its default list adds ReplicaSet and ReplicationController: every
    # Deployment rollout keeps old ReplicaSets at zero replicas, whose policy
    # reports repeat the Deployment's failure until the next rollout.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet,Job,CronJob
    policies.kyverno.io/title: Require Non-Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Running containers as root increases the attack surface. This policy requires
      containers to run as non-root user (runAsNonRoot: true).
spec:
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - vault
                - ingress
      validate:
        failureAction: {{ include "platform-security.failureAction" . }}
        message: "Containers must run as non-root user (securityContext.runAsNonRoot: true)."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): true
            containers:
              - =(securityContext):
                  =(runAsNonRoot): true
{{- end }}
