{{- if and .Values.kyverno.enabled .Values.kyvernoPolicies.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Running containers as root increases the attack surface. This policy requires
      containers to run as non-root user (runAsNonRoot: true).
spec:
  validationActions: [{{ include "platform-security.validationAction" . }}]
  evaluation:
    background:
      enabled: true
  # Kyverno generates this policy's checks for the Pod controllers listed
  # here. Its default list adds ReplicaSets: every Deployment rollout keeps
  # old ReplicaSets at zero replicas, whose policy reports repeat the
  # Deployment's failure until the next rollout.
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, statefulsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
            - argocd
            - vault
            - ingress
  validations:
    - expression: >-
        (!has(object.spec.securityContext) ||
         !has(object.spec.securityContext.runAsNonRoot) ||
         object.spec.securityContext.runAsNonRoot == true) &&
        object.spec.containers.all(c,
          !has(c.securityContext) || !has(c.securityContext.runAsNonRoot) ||
          c.securityContext.runAsNonRoot == true)
      message: "Containers must run as non-root user (securityContext.runAsNonRoot: true)."
{{- end }}
