{{- if and .Values.kyverno.enabled .Values.kyvernoPolicies.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privilege escalation allows processes to gain more privileges than their parent.
      This policy requires allowPrivilegeEscalation to be set to false.
spec:
  validationActions: [{{ include "platform-security.validationAction" . }}]
  evaluation:
    background:
      enabled: true
  # Kyverno generates this policy's checks for the Pod controllers listed
  # here. Its default list adds ReplicaSets: every Deployment rollout keeps
  # old ReplicaSets at zero replicas, whose policy reports repeat the
  # Deployment's failure until the next rollout.
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, statefulsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
            - vault
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)
      message: "Privilege escalation is not allowed (securityContext.allowPrivilegeEscalation: false)."
{{- end }}
