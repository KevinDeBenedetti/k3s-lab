{{- if and .Values.kyverno.enabled .Values.kyvernoPolicies.enabled }}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    # Kyverno auto-generates this policy's rules for the Pod controllers listed
    # here. Its default list adds ReplicaSet and ReplicationController: every
    # Deployment rollout keeps old ReplicaSets at zero replicas, whose policy
    # reports repeat the Deployment's failure until the next rollout.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet,Job,CronJob
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privilege escalation allows processes to gain more privileges than their parent.
      This policy requires allowPrivilegeEscalation to be set to false.
spec:
  background: true
  rules:
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - vault
      validate:
        failureAction: {{ include "platform-security.failureAction" . }}
        message: "Privilege escalation is not allowed (securityContext.allowPrivilegeEscalation: false)."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
{{- end }}
