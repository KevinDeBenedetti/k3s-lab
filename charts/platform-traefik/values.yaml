# =============================================================================
# platform-traefik — sensible defaults for single-node k3s
# Override per-cluster in infra/platform/traefik/values.yaml
# =============================================================================
traefik:
  # Chart 41.0.2 points at appVersion v3.7.6, which is affected by two HIGH
  # advisories that do apply to our configuration:
  #   - GHSA-cxjq-mrr5-89rv (auth bypass via path traversal in ReplacePathRegex):
  #     affects v3.7.0–v3.7.6, patched in v3.7.7.
  #   - GHSA-3ccp-42pg-hgv6 (cross-user response poisoning via proxied CONNECT on
  #     the shared keep-alive pool): affects everything <= v3.7.8, patched in
  #     v3.7.9. Published 2026-07-27, i.e. 12 days after we froze v3.7.8 — hence
  #     the need to re-check the advisories at every review of this pin.
  # GHSA-8rxv-jg7p-wvg3, which motivated the original pin, does NOT concern us:
  # it targets the kubernetesIngressNGINX provider, which we do not enable (see
  # the providers section below).
  # Drop this pin as soon as a chart ships a proxy at least as recent.
  #
  # `versionOverride` is no longer needed since chart 41.0.0: its
  # templates/requirements.yaml only fails the render on a *major* version gap
  # (traefik.isMajorAboveMax helper). A v3.7.8 against a
  # traefik.io/proxy-max-version of v3.7.6 only produces a warning in NOTES.txt.
  # The guard therefore stays active where it matters, and the version seen by
  # the chart's feature-gating is finally the version actually deployed.
  image:
    tag: v3.7.9

  ingressRoute:
    dashboard:
      enabled: false

  # HTTP → HTTPS redirect
  ports:
    web:
      port: 8000
      exposedPort: 80
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      port: 8443
      exposedPort: 443

  # Resource limits for single-node
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  # Logs — syntax aligned with upstream since chart 41.0.0: `logs.general` became
  # `log`, `logs.access` became `accessLog`. This is not cosmetic:
  # values.schema.json declares additionalProperties: false, so the old `logs`
  # key would fail the render instead of being ignored.
  log:
    level: INFO
  accessLog:
    enabled: true

  # Providers
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true

  # Service type — LoadBalancer for bare metal (k3s klipper-lb or metallb)
  service:
    type: LoadBalancer
