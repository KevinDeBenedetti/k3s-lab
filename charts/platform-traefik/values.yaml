# =============================================================================
# platform-traefik — sensible defaults for single-node k3s
# Override per-cluster in infra/platform/traefik/values.yaml
# =============================================================================
traefik:
  # PIN RE-ADDED 2026-08-03 — three advisories published that day cover every
  # v3.7.x up to and including v3.7.9, patched in v3.7.10 (proxy released
  # 2026-07-31; the advisories are its coordinated disclosure):
  #   GHSA-fgjj-px3w-67xx (HIGH)   Gateway API route identity collision →
  #                                cross-namespace backend hijacking
  #   GHSA-62fc-8686-hfmq (medium) allowCrossNamespace=false bypass via
  #                                @kubernetescrd TraefikService backendRef
  #   GHSA-6765-c87h-8mrf (low)    BasicAuth singleflight key collision →
  #                                authenticated identity spoofing
  # No upstream chart ships v3.7.10 yet (41.1.1 still declares appVersion
  # v3.7.9), so this is exactly the escape hatch this comment has always
  # described: `image.tag` — and only it, never `versionOverride`, see
  # README.md. Both checks pick the pin up automatically.
  #
  # The pin overshoots the subchart's traefik.io/proxy-max-version (v3.7.9) by
  # one patch: since 41.0.0 that guard only warns on a minor/patch gap
  # (NOTES.txt), it no longer fails the render.
  #
  # DROP this pin at the next subchart bump whose appVersion is >= v3.7.10 —
  # a pin that upstream has caught up with is a duplicate that only drifts.
  image:
    tag: v3.7.10

  ingressRoute:
    dashboard:
      enabled: false

  # HTTP → HTTPS redirect
  ports:
    web:
      port: 8000
      exposedPort: 80
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      port: 8443
      exposedPort: 443

  # Resource limits for single-node
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  # Logs — syntax aligned with upstream since chart 41.0.0: `logs.general` became
  # `log`, `logs.access` became `accessLog`. This is not cosmetic:
  # values.schema.json declares additionalProperties: false, so the old `logs`
  # key would fail the render instead of being ignored.
  log:
    level: INFO
  accessLog:
    enabled: true

  # Providers
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true

  # Service type — LoadBalancer for bare metal (k3s klipper-lb or metallb)
  service:
    type: LoadBalancer
