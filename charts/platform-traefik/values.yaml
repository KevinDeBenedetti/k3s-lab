# =============================================================================
# platform-traefik — sensible defaults for single-node k3s
# Override per-cluster in infra/platform/traefik/values.yaml
# =============================================================================
traefik:
  # NO `image.tag` HERE — deliberate, since 2026-07-30. Subchart 41.1.0 ships
  # appVersion v3.7.9, which is exactly the version the pin used to force, so the
  # override became redundant: the proxy version now comes from the subchart
  # (traefik.proxyVersion resolves versionOverride → image.tag → appVersion).
  # Dropping it also puts us back under traefik.io/proxy-max-version (v3.7.9),
  # which the pin had been overshooting since 2026-07-22.
  #
  # This is still a security-relevant value, it is just no longer stated here.
  # scripts/check-traefik-advisories.sh confronts the *effective* version — pin
  # if one is set, otherwise the subchart's appVersion — with the traefik/traefik
  # advisories, daily. Two HIGH advisories are the reason this file ever carried
  # a pin, both now behind us: GHSA-cxjq-mrr5-89rv (auth bypass via path
  # traversal in ReplacePathRegex, <= v3.7.6, patched v3.7.7) and
  # GHSA-3ccp-42pg-hgv6 (cross-user response poisoning via proxied CONNECT on the
  # shared keep-alive pool, <= v3.7.8, patched v3.7.9).
  #
  # Bring `image.tag` back — and only it, never `versionOverride` — the next time
  # an advisory lands ahead of the chart. Both checks honour it as an override.
  # See README.md for the procedure and for why `versionOverride` stays out.

  ingressRoute:
    dashboard:
      enabled: false

  # HTTP → HTTPS redirect
  ports:
    web:
      port: 8000
      exposedPort: 80
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      port: 8443
      exposedPort: 443

  # Resource limits for single-node
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  # Logs — syntax aligned with upstream since chart 41.0.0: `logs.general` became
  # `log`, `logs.access` became `accessLog`. This is not cosmetic:
  # values.schema.json declares additionalProperties: false, so the old `logs`
  # key would fail the render instead of being ignored.
  log:
    level: INFO
  accessLog:
    enabled: true

  # Providers
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true

  # Service type — LoadBalancer for bare metal (k3s klipper-lb or metallb)
  service:
    type: LoadBalancer
