# =============================================================================
# platform-traefik — sensible defaults for single-node k3s
# Override per-cluster in infra/platform/traefik/values.yaml
# =============================================================================
traefik:
  # Le chart 40.3.0 pointe sur appVersion v3.7.4, encore affecté par
  # GHSA-8rxv-jg7p-wvg3 (HIGH, affecte <= v3.7.7, corrigé en v3.7.8) et
  # GHSA-cxjq-mrr5-89rv (HIGH, affecte <= v3.7.6). Aucun chart ne pinne v3.7.8 à ce jour.
  # À retirer dès qu'une version du chart embarque v3.7.8 ou plus.
  image:
    tag: v3.7.8

  ingressRoute:
    dashboard:
      enabled: false

  # HTTP → HTTPS redirect
  ports:
    web:
      port: 8000
      exposedPort: 80
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      port: 8443
      exposedPort: 443

  # Resource limits for single-node
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  # Logs
  logs:
    general:
      level: INFO
    access:
      enabled: true

  # Providers
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true

  # Service type — LoadBalancer for bare metal (k3s klipper-lb or metallb)
  service:
    type: LoadBalancer
