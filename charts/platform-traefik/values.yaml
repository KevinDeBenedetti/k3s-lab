# =============================================================================
# platform-traefik — sensible defaults for single-node k3s
# Override per-cluster in infra/platform/traefik/values.yaml
# =============================================================================
traefik:
  # PIN DROPPED 2026-09-07 — subchart bumped 41.1.0 -> 41.5.0, which ships
  # appVersion v3.7.13. v3.7.12 (41.4.0, same-day bump) turned out to be
  # covered by 5 more advisories published later that same day, one CRITICAL
  # (GHSA-qqjf-53cj-pwvv, HTTP/3 backend NTLM connection reuse), plus
  # GHSA-v67p-phpq-fc8x, GHSA-8fcf-v89g-xpg6, GHSA-f52w-8j3h-j724,
  # GHSA-w4v4-9rw7-5326 — all patched in v3.7.13 (see README.md). A pin here
  # would only duplicate upstream's own value and drift.
  #
  # RE-ADD `image.tag` only if a future advisory lands before upstream ships
  # the fix — never `versionOverride`, see README.md.

  ingressRoute:
    dashboard:
      enabled: false

  # HTTP → HTTPS redirect
  ports:
    web:
      port: 8000
      exposedPort: 80
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      port: 8443
      exposedPort: 443

  # Resource limits for single-node
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  # Logs — syntax aligned with upstream since chart 41.0.0: `logs.general` became
  # `log`, `logs.access` became `accessLog`. This is not cosmetic:
  # values.schema.json declares additionalProperties: false, so the old `logs`
  # key would fail the render instead of being ignored.
  log:
    level: INFO
  accessLog:
    enabled: true

  # Providers
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true

  # Service type — LoadBalancer for bare metal (k3s klipper-lb or metallb)
  service:
    type: LoadBalancer
