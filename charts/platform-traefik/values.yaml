# =============================================================================
# platform-traefik — sensible defaults for single-node k3s
# Override per-cluster in infra/platform/traefik/values.yaml
# =============================================================================
traefik:
  # PIN DROPPED 2026-09-07 — subchart bumped 41.1.0 -> 41.4.0, which ships
  # appVersion v3.7.12. That patches every advisory that forced the previous
  # v3.7.10 pin (GHSA-cjr6-pf59-jq29, GHSA-7ghq-v6jf-g56c, GHSA-m6wx-622r-48r9,
  # GHSA-rf44-j88r-hh8c, GHSA-5w68-77r2-r64c, GHSA-j994-9gqj-9hwq,
  # GHSA-g55h-rg46-x9c5 — see README.md), so a pin here would only duplicate
  # upstream's own value and drift.
  #
  # RE-ADD `image.tag` only if a future advisory lands before upstream ships
  # the fix — never `versionOverride`, see README.md.

  ingressRoute:
    dashboard:
      enabled: false

  # HTTP → HTTPS redirect
  ports:
    web:
      port: 8000
      exposedPort: 80
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      port: 8443
      exposedPort: 443

  # Resource limits for single-node
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  # Logs — syntax aligned with upstream since chart 41.0.0: `logs.general` became
  # `log`, `logs.access` became `accessLog`. This is not cosmetic:
  # values.schema.json declares additionalProperties: false, so the old `logs`
  # key would fail the render instead of being ignored.
  log:
    level: INFO
  accessLog:
    enabled: true

  # Providers
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true

  # Service type — LoadBalancer for bare metal (k3s klipper-lb or metallb)
  service:
    type: LoadBalancer
