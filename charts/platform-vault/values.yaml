vault:
  fullnameOverride: vault
  global:
    enabled: true
    tlsDisable: false
  injector:
    enabled: false
  server:
    image:
      repository: hashicorp/vault
      # Bumped 1.21.2 → 1.21.4 on 2026-08-06. This is the chart's default; a
      # deployment that layers its own values may set the tag itself.
      #
      # scripts/check-rendered-images.sh asserts this pin reaches the render, so
      # it cannot go decorative. It does NOT compare against a cluster.
      tag: "1.21.4"
      pullPolicy: IfNotPresent
    # Standalone default: a single-node `helm install` of the umbrella wants
    # `file` storage. For `raft` storage set `ha.enabled: true` in your values —
    # the upstream chart only emits the raft config when HA is on.
    ha:
      enabled: false
    dataStorage:
      enabled: true
      size: 5Gi
      storageClass: local-path
    # No audit PVC: send the audit device to stdout instead
    # (`vault audit enable file file_path=stdout`), where the log collector
    # picks it up and rotates it. A file device on a PVC grows without bound,
    # and Vault refuses EVERY request once its only audit device cannot write.
    # volumeClaimTemplates are immutable — see README.md before flipping this on
    # an existing install.
    auditStorage:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    readinessProbe:
      enabled: true
      path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
    livenessProbe:
      enabled: true
      path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
      initialDelaySeconds: 60
    ingress:
      enabled: false
    # The listener below reads its cert from /vault/userconfig/vault-tls —
    # mount the `vault-tls` secret there or Vault cannot start.
    # The secret must exist in the vault namespace (e.g. a cert-manager
    # Certificate, or created manually) before the pod is scheduled.
    volumes:
      - name: vault-tls
        secret:
          secretName: vault-tls
    volumeMounts:
      - name: vault-tls
        mountPath: /vault/userconfig/vault-tls
        readOnly: true
    standalone:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 0
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
        }

        storage "raft" {
          path    = "/vault/data"
          node_id = "vault-0"
        }

        service_registration "kubernetes" {}

        disable_mlock = true
  ui:
    enabled: true
    serviceType: ClusterIP
