vault:
  fullnameOverride: vault
  global:
    enabled: true
    tlsDisable: false
  injector:
    enabled: false
  server:
    image:
      repository: hashicorp/vault
      # Bumped 1.21.2 → 1.21.4 on 2026-08-06. This pin is the *umbrella/standalone*
      # default only: the infra `platform-vault` Application is multi-source and
      # layers `$values/platform/vault/values.yaml` over this file, which sets the
      # tag itself. Leaving it at 1.21.2 meant the chart advertised a version it
      # does not deploy — see the `ha` note below for the same problem.
      #
      # scripts/check-rendered-images.sh now asserts this pin reaches the render,
      # so it can no longer go decorative. It does NOT compare against the
      # cluster: check-deployed-charts.sh owns that, and needs access this repo's
      # PR-time CI does not have.
      tag: "1.21.4"
      pullPolicy: IfNotPresent
    # ⚠️ Overridden to `true` by infra. The running Vault uses the `raft` storage
    # backend (vault-config ConfigMap on the cluster), which the upstream chart
    # only emits when `ha.enabled` is true — so this `false` describes no cluster
    # this repo actually operates. It is kept as the standalone default because a
    # single-node `helm install` of the umbrella wants `file` storage, not raft.
    ha:
      enabled: false
    dataStorage:
      enabled: true
      size: 5Gi
      storageClass: local-path
    auditStorage:
      enabled: true
      size: 2Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    readinessProbe:
      enabled: true
      path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
    livenessProbe:
      enabled: true
      path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
      initialDelaySeconds: 60
    ingress:
      enabled: false
    # The listener below reads its cert from /vault/userconfig/vault-tls —
    # mount the `vault-tls` secret there or Vault cannot start.
    # The secret must exist in the vault namespace (e.g. a cert-manager
    # Certificate, or created manually) before the pod is scheduled.
    volumes:
      - name: vault-tls
        secret:
          secretName: vault-tls
    volumeMounts:
      - name: vault-tls
        mountPath: /vault/userconfig/vault-tls
        readOnly: true
    standalone:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 0
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
        }

        storage "raft" {
          path    = "/vault/data"
          node_id = "vault-0"
        }

        service_registration "kubernetes" {}

        disable_mlock = true
  ui:
    enabled: true
    serviceType: ClusterIP
