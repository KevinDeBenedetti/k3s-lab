# =============================================================================
# Release Charts — Package and publish Helm charts to GHCR (OCI)
#
# Triggers:
#   - workflow_run: automatically after CI passes on main (avoids GITHUB_TOKEN
#     tag limitation — workflow_run is a platform event that always fires)
#   - workflow_dispatch: manual re-run from Actions tab
#
# Only publishes charts whose version is NOT already on GHCR (idempotent).
# =============================================================================
name: Release Charts

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-charts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Without this, checkout stores GITHUB_TOKEN in
          # `http.https://github.com/.extraheader`, which git sends on *every*
          # github.com URL — overriding the app-token credentials embedded in
          # the pin-bump push URL below. This job's GITHUB_TOKEN is
          # `contents: read`, so the push 403s before any branch is created.
          # That is exactly how the 0.18.0 run failed on 2026-08-03.
          # Nothing else in this job performs authenticated git operations.
          persist-credentials: false

      - name: Set lowercase registry path
        id: registry
        run: echo "path=ghcr.io/${OWNER,,}/charts" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: Package and push new chart versions
        id: publish
        run: |
          published=""
          skipped=""

          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              version=$(grep '^version:' "$chart/Chart.yaml" | awk '{print $2}')
              registry_path="${{ steps.registry.outputs.path }}"

              # Check if this version already exists on GHCR
              if helm show chart "oci://${registry_path}/${chart_name}" --version "$version" > /dev/null 2>&1; then
                echo "⏭️  $chart_name v$version already published — skipping"
                skipped="${skipped}${chart_name}:${version} "
                continue
              fi

              echo "::group::Publishing $chart_name v$version"
              for attempt in 1 2 3 4 5; do
                if helm dependency update "$chart"; then
                  break
                fi
                echo "⚠️  helm dependency update failed (attempt $attempt/5) — retrying in 10s…"
                sleep 10
                if [ "$attempt" -eq 5 ]; then
                  echo "::error::helm dependency update failed after 5 attempts"
                  exit 1
                fi
              done
              helm package "$chart" -d /tmp/charts/
              # Exact name, never a glob: "${chart_name}-*" also captures charts
              # whose name is a prefix (platform-vault-* catches
              # platform-vault-seeder-*.tgz), and `charts/*/` sorts the seeder
              # first — the trailing slash makes '-' sort before '/'.
              pkg="/tmp/charts/${chart_name}-${version}.tgz"
              helm push "$pkg" "oci://${registry_path}"
              published="${published}${chart_name}:${version} "
              echo "::endgroup::"
            fi
          done

          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"

          if [ -z "$published" ]; then
            echo "ℹ️  No new chart versions to publish"
          else
            echo "✅ Published: $published"
          fi

      # ─── Umbrella validation (post-publish) ─────────────────────────────────
      # platform-deployment is excluded from the CI render
      # (`template-exclude-paths`): its 7 dependencies come from GHCR, so
      # rendering it from source CI would validate the registry's state rather
      # than the repo's source. That coupling created a circular deadlock on
      # 2026-07-21 — the umbrella pinned a broken platform-traefik, CI failed,
      # and the workflow_run gate prevented publishing the fix.
      #
      # Here the subcharts have just been pushed: this is the only place where
      # the umbrella chart can be rendered. Without this step, nobody renders it
      # at all.
      #
      # ⚠️ This check is *post-publish*: it detects an unrenderable umbrella, it
      # does not prevent pushing one. That is the price of not reintroducing the
      # circular deadlock.
      - name: Render platform-deployment (post-publish validation)
        id: render
        run: |
          chart="charts/platform-deployment"

          for attempt in 1 2 3 4 5; do
            if helm dependency update "$chart"; then
              break
            fi
            echo "⚠️  helm dependency update failed (attempt $attempt/5) — retrying in 10s…"
            sleep 10
            if [ "$attempt" -eq 5 ]; then
              echo "::error::umbrella: helm dependency update failed after 5 attempts"
              exit 1
            fi
          done

          # `helm dependency update` can succeed while leaving a dependency
          # unresolved; `dependency list` is what reveals that.
          helm dependency list "$chart"
          if helm dependency list "$chart" | grep -qE '(missing|wrong version)'; then
            echo "::error::umbrella: unresolved dependency — pins out of sync with the registry?"
            exit 1
          fi

          if ! helm template platform-deployment "$chart" > /tmp/umbrella.yaml; then
            echo "::error::umbrella: helm template failed — umbrella chart is not renderable"
            exit 1
          fi

          # Which subcharts actually produced manifests — not how many documents
          # came out. The previous test accepted any render of 7+ documents, on
          # the reasoning "one manifest per subchart". It does not hold: measured
          # on 2026-08-01, an umbrella missing four of its seven subcharts
          # (ingress included) still rendered 17 documents, against 401 for a
          # healthy one, and passed. See scripts/check-umbrella-render.sh.
          if ! ./scripts/check-umbrella-render.sh --chart "$chart" --render /tmp/umbrella.yaml; then
            echo "::error::umbrella: hollow render — a subchart contributed nothing"
            exit 1
          fi

          docs=$(grep -c '^# Source:' /tmp/umbrella.yaml || true)
          echo "✅ platform-deployment rendered: $docs manifests"
          echo "documents=$docs" >> "$GITHUB_OUTPUT"

      # ─── Umbrella pin bump (post-publish PR) ────────────────────────────────
      # Right after publishing, every version GHCR serves is, by definition, one
      # the umbrella's pins may reference — the "pins may only point at
      # published versions" constraint holds by construction. Decided on
      # 2026-08-03, when the umbrella became the repository's public entry point
      # and its manual bump stopped being acceptable as a recurring red CI.
      #
      # Since 2026-10-08 each chart has its own version (one release-please
      # component per chart), so each pin is aligned on the latest version of
      # *its* subchart, read from the registry — not on the umbrella's version.
      # One rolling branch, force-pushed: a second publish before the PR is
      # merged updates the same PR instead of opening a competing one.
      #
      # A PR rather than a direct push: check-umbrella-pins.sh stays the
      # watchdog, CI runs on the branch, and a human merges. The commit is a
      # `fix(platform-deployment):` on purpose — changing the pins IS a change
      # of the umbrella, so merging it releases platform-deployment alone. No
      # release loop: publishing the umbrella changes none of its own pins, so
      # the next run finds them aligned and opens nothing.
      #
      # The app token (not GITHUB_TOKEN) matters: PRs opened with the default
      # token do not trigger CI, and an unchecked pin bump defeats the purpose.
      - name: Create app token for the pin-bump PR
        id: app-token
        if: steps.publish.outputs.published != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open a PR aligning the umbrella pins
        if: steps.publish.outputs.published != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source lib/log.sh; source lib/semver.sh; source lib/chart-deps.sh; source lib/registry.sh

          umbrella=charts/platform-deployment/Chart.yaml
          branch="chore/umbrella-pins"

          # Latest published version of every subchart, straight from GHCR —
          # the same source and the same semver_latest as check-umbrella-pins.sh.
          sets=()
          while IFS=$'\t' read -r name _ repository; do
            [ -n "$name" ] || continue
            IFS=$'\t' read -r host path < <(chart_oci_registry "$repository" "$name")
            latest="$(registry_tags "$host" "$path" | semver_latest)"
            if [ -z "$latest" ]; then
              echo "::error::no published version found for $name at $host/$path"
              exit 1
            fi
            sets+=(--set "${name}=${latest}")
          done < <(chart_oci_deps "$umbrella")

          ./scripts/bump-umbrella-pins.sh "${sets[@]}"

          # Ask git, not the script's wording, whether there is anything to
          # commit: `git commit` on an empty index fails the step, and an
          # already-aligned umbrella is a normal outcome, not an error.
          if git diff --quiet -- "$umbrella"; then
            echo "ℹ️  Pins already aligned on the registry — no PR needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$umbrella"
          git commit -m "fix(platform-deployment): align subchart pins on the latest published versions" \
            -m "Opened automatically by release-charts after publishing: ${PUBLISHED}. See scripts/bump-umbrella-pins.sh."
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "♻️  PR for $branch already open — branch updated"
          else
            {
              echo "Aligns each \`platform-deployment\` pin on the latest version GHCR serves for that subchart. Opened automatically by \`release-charts\` right after publishing."
              echo ""
              echo '```diff'
              git diff HEAD~1 -U0 -- "$umbrella" | grep -E '^[-+] +version:' || true
              echo '```'
              echo ""
              echo "The \`umbrella-pins\` CI job on this PR is the proof the alignment is correct — merge on green. The commit is a \`fix(platform-deployment):\`, so merging releases the umbrella, and only it."
            } > /tmp/pr-body.md
            gh pr create --head "$branch" \
              --title "fix(platform-deployment): align subchart pins on the latest published versions" \
              --body-file /tmp/pr-body.md
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Chart Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          published="${{ steps.publish.outputs.published }}"
          skipped="${{ steps.publish.outputs.skipped }}"

          if [ -n "$published" ]; then
            echo "### ✅ Published" >> "$GITHUB_STEP_SUMMARY"
            for entry in $published; do
              name="${entry%%:*}"
              ver="${entry##*:}"
              echo "- **$name** v$ver → \`${{ steps.registry.outputs.path }}/$name\`" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$skipped" ]; then
            echo "### ⏭️ Already published (skipped)" >> "$GITHUB_STEP_SUMMARY"
            for entry in $skipped; do
              name="${entry%%:*}"
              ver="${entry##*:}"
              echo "- $name v$ver" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          if [ -z "$published" ] && [ -z "$skipped" ]; then
            echo "No charts found." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🧪 Umbrella render" >> "$GITHUB_STEP_SUMMARY"
          docs="${{ steps.render.outputs.documents }}"
          if [ -n "$docs" ]; then
            echo "- \`platform-deployment\` rendered: **$docs** manifests" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ \`platform-deployment\` not renderable — see the step log" >> "$GITHUB_STEP_SUMMARY"
          fi
