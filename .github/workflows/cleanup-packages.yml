# =============================================================================
# cleanup-packages.yml — Purge old GHCR chart versions after each release
#
# Keeps the 30 most recent versions of each chart package.
# Runs automatically after a GitHub Release is published, and can be
# triggered manually from the Actions tab.
#
# ⚠️  Retention must stay well above the number of releases separating the
# oldest version still pinned by a consumer (ArgoCD, umbrella chart) from the
# latest published one. With a retention of 5, the 2026-07-21 purge deleted
# platform-*:0.9.1, still referenced by the `platform` ApplicationSet in
# infra/argocd — the Applications could no longer resolve their chart.
# =============================================================================
name: Cleanup GHCR packages

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: cleanup-packages-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - charts/platform-argocd
          - charts/platform-base
          - charts/platform-cert-manager
          - charts/platform-deployment
          - charts/platform-external-secrets
          - charts/platform-monitoring
          - charts/platform-security
          - charts/platform-traefik
          - charts/platform-vault
          - charts/platform-vault-seeder

    steps:
      - name: Delete old versions of ${{ matrix.chart }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.chart }}
          package-type: container
          min-versions-to-keep: 30
          ignore-versions: '^(latest|stable)$'
          token: ${{ secrets.GITHUB_TOKEN }}
