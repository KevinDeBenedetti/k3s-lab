# =============================================================================
# CI — k3s-lab lint, tests, security & validation
#
# Runs on every push and PR to main.
# Does NOT require a real cluster — all checks are static/offline.
#
# Jobs:
#   shell-ci    — shellcheck + actionlint + bats
#   kubernetes  — kubeconform + .env.example check
#   security    — Gitleaks secret scanning
#   helm-lint   — Helm chart linting
#   resource-limits — Verify all charts define resource limits
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ─── Shell linting ─────────────────────────────────────────────────────────
  shell-ci:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-shell.yml@main
    with:
      run-shellcheck: true
      shellcheck-severity: warning
      run-actionlint: true
      actionlint-paths: .github/workflows/
      run-bats: true
      bats-tests-dir: tests/bats/
      bats-submodules: false
      run-docker: false
      run-docs-link-check: true

  # ─── Kubernetes validation + .env.example check ──────────────────────────
  kubernetes:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-kubernetes.yml@main
    with:
      run-kubeconform: true
      kubeconform-paths: kubernetes/
      kubeconform-exclude: '.*(kustomization\.yaml|-values\.yaml|-patch\.yaml)'
      kubeconform-include-crds-catalog: true
      run-env-example: true
      env-example-required-keys: >-
        SERVER_IP AGENT_IP DOMAIN EMAIL
        DASHBOARD_DOMAIN DASHBOARD_PASSWORD
        GRAFANA_DOMAIN GRAFANA_PASSWORD
        KUBECONFIG_CONTEXT K3S_VERSION K3S_NODE_TOKEN

  # ─── Secret scanning ──────────────────────────────────────────────────────
  security:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
      pull-requests: read
    with:
      run-node-audit: false
      run-python-audit: false
      run-secret-scan: true
      # CodeQL disabled — no supported languages in this repo (Shell/YAML only)
      run-codeql: false

  # ─── Helm chart linting ─────────────────────────────────────────────────────
  helm-lint:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-helm.yml@main
    with:
      run-lint: true
      # `helm lint` alone does not download dependencies, so the subchart guards
      # (e.g. traefik/templates/requirements.yaml, which rejects any proxy above
      # traefik.io/proxy-max-version) are never rendered. The template job runs
      # `helm dependency update` before `helm template` — that is what catches
      # these failures. Without it, an unrenderable chart was published as
      # 0.13.0, 0.13.1 and 0.13.2 without any CI complaining.
      run-template: true
      chart-paths: charts/*
      # platform-deployment is a composition chart: it has no templates of its
      # own (just NOTES.txt) and pulls its 7 dependencies from GHCR. Rendering it
      # here would validate the registry's contents rather than this repo's
      # source — and its subcharts are already rendered one by one by this same
      # loop. That coupling created a circular deadlock on 2026-07-21: the
      # umbrella pinned platform-traefik:0.13.0 (broken), CI failed, and the
      # workflow_run gate prevented publishing the fix. Validating the umbrella
      # belongs to release-charts, after the subcharts are published.
      template-exclude-paths: charts/platform-deployment
      helm-version: v3.17.0

  # ─── Resource limits check ────────────────────────────────────────────────
  resource-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check resource limits in chart values
        run: ./scripts/check-resource-limits.sh

  # ─── Traefik image check ──────────────────────────────────────────────────
  # helm-lint above renders the chart and proves it is *renderable*; it does not
  # say which image comes out. The proxy version is a security decision
  # (GHSA-cxjq <= v3.7.6, GHSA-3ccp <= v3.7.8) that the subchart has already had
  # the means to neutralise silently — versionOverride, or the
  # traefik.io/proxy-max-version guard falling back to the chart's appVersion.
  # This job compares the image actually rendered against the version the chart
  # is meant to deploy: the traefik.image.tag pin when one is set, otherwise the
  # locked subchart's appVersion (no pin since 2026-07-30, upstream caught up).
  traefik-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0
      - name: Verify that the rendered Traefik image matches the expected version
        run: ./scripts/check-traefik-image.sh

  # ─── Traefik advisory check ───────────────────────────────────────────────
  # The daily `traefik-advisories` workflow catches a version that *goes* stale.
  # It cannot catch a version that is already vulnerable the moment it is
  # written — between the commit and the next 06:12 UTC run there is a window,
  # and that window is exactly where the decision was made. Running the same
  # check here closes it at the point of change.
  #
  # Deliberately not path-filtered: the check is one API call, and now that the
  # proxy version comes from the subchart's appVersion, the set of files that
  # can change it is wider than it looks (values.yaml, Chart.yaml, Chart.lock).
  # Running it always is cheaper than getting that list wrong.
  traefik-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Confront the deployed proxy version with the traefik advisories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-traefik-advisories.sh

  # ─── Umbrella pin drift ───────────────────────────────────────────────────
  # platform-deployment pins its 7 subcharts by hand, one edit per release. The
  # edit is easy; remembering it is not — the umbrella sat on 0.13.0 for three
  # consecutive releases while resolving, rendering and publishing perfectly.
  # This job only reports drift and never writes: keeping the pins manual is a
  # deliberate choice (an alignment script was written and removed on
  # 2026-07-30), so what was missing was the detection, not the automation.
  umbrella-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare the umbrella pins with what is published on GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-umbrella-pins.sh

  # ─── Docs dispatch (push to main only) ───────────────────────────────────
  # cd-docs.yml now authenticates via GitHub App (client-id + APP_PRIVATE_KEY);
  # passing an undeclared secret (the old PAT_TOKEN) startup-fails the whole run.
  # `traefik-advisories` and `umbrella-pins` are deliberately NOT in `needs`:
  # both judge external state (the advisory API, the GHCR registry) that moves
  # without a commit, so either can go red on a tree that has not changed. They
  # already fail the CI run, which is the signal we want; blocking publication
  # of the documentation on them would mean a new upstream advisory, or the
  # normal window between a release and its follow-up pin commit, also silently
  # freezes the docs site.
  docs:
    needs: [shell-ci, kubernetes, security, helm-lint, resource-limits, traefik-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cd-docs.yml@main
    with:
      client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
