# =============================================================================
# CI — k3s-lab lint, tests, security & validation
#
# Runs on every push and PR to main.
# Does NOT require a real cluster — all checks are static/offline.
#
# Jobs:
#   shell-ci    — shellcheck + actionlint + bats
#   kubernetes  — kubeconform + .env.example check
#   security    — Gitleaks secret scanning
#   helm-lint   — Helm chart linting
#   resource-limits — Verify all charts define resource limits
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ─── Shell linting ─────────────────────────────────────────────────────────
  shell-ci:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-shell.yml@main
    with:
      run-shellcheck: true
      shellcheck-severity: warning
      run-actionlint: true
      actionlint-paths: .github/workflows/
      run-bats: true
      bats-tests-dir: tests/bats/
      bats-submodules: false
      run-docker: false
      run-docs-link-check: true

  # ─── Kubernetes validation + .env.example check ──────────────────────────
  kubernetes:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-kubernetes.yml@main
    with:
      run-kubeconform: true
      kubeconform-paths: kubernetes/
      kubeconform-exclude: '.*(kustomization\.yaml|-values\.yaml|-patch\.yaml)'
      kubeconform-include-crds-catalog: true
      run-env-example: true
      env-example-required-keys: >-
        SERVER_IP AGENT_IP DOMAIN EMAIL
        DASHBOARD_DOMAIN DASHBOARD_PASSWORD
        GRAFANA_DOMAIN GRAFANA_PASSWORD
        KUBECONFIG_CONTEXT K3S_VERSION K3S_NODE_TOKEN

  # ─── Secret scanning ──────────────────────────────────────────────────────
  security:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
      pull-requests: read
    with:
      run-node-audit: false
      run-python-audit: false
      run-secret-scan: true
      # CodeQL disabled — no supported languages in this repo (Shell/YAML only)
      run-codeql: false

  # ─── Helm chart linting ─────────────────────────────────────────────────────
  helm-lint:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-helm.yml@main
    with:
      run-lint: true
      # `helm lint` seul ne télécharge pas les dépendances : les garde-fous des
      # subcharts (ex. traefik/templates/requirements.yaml, qui refuse tout proxy
      # au-delà de traefik.io/proxy-max-version) ne sont donc jamais rendus. Le job
      # template fait `helm dependency update` avant `helm template` — c'est lui qui
      # attrape ces échecs. Sans lui, un chart impossible à rendre a été publié en
      # 0.13.0, 0.13.1 et 0.13.2 sans qu'aucune CI ne bronche.
      run-template: true
      chart-paths: charts/*
      # platform-deployment est un chart de composition : il n'a aucun template
      # propre (juste NOTES.txt) et tire ses 7 dépendances depuis GHCR. Le rendre
      # ici ne valide donc pas la source de ce repo mais le contenu du registry —
      # ses sous-charts sont déjà rendus un par un par cette même boucle. Ce
      # couplage a créé un blocage circulaire le 2026-07-21 : l'umbrella épinglait
      # platform-traefik:0.13.0 (cassé), la CI échouait, et la porte workflow_run
      # empêchait de publier la version corrigée. La validation de l'umbrella
      # relève de release-charts, après publication des sous-charts.
      template-exclude-paths: charts/platform-deployment
      helm-version: v3.17.0

  # ─── Resource limits check ────────────────────────────────────────────────
  resource-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check resource limits in chart values
        run: ./scripts/check-resource-limits.sh

  # ─── Docs dispatch (push to main only) ───────────────────────────────────
  # cd-docs.yml now authenticates via GitHub App (client-id + APP_PRIVATE_KEY);
  # passing an undeclared secret (the old PAT_TOKEN) startup-fails the whole run.
  docs:
    needs: [shell-ci, kubernetes, security, helm-lint, resource-limits]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cd-docs.yml@main
    with:
      client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
