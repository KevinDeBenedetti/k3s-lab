# =============================================================================
# CI — k3s-lab lint, tests, security & validation
#
# Runs on every push and PR to main.
# Does NOT require a real cluster — all checks are static/offline.
#
# Jobs:
#   shell-ci    — shellcheck + actionlint + bats
#   kubernetes  — kubeconform + .env.example check
#   security    — Gitleaks secret scanning
#   helm-lint / helm-template — Helm chart lint and render dry-run (inline)
#   kyverno-policies — Kyverno CLI (subchart's version) against the policy fixtures
#   resource-limits — Every rendered container has requests and a memory limit
#   ansible     — Playbook syntax-check + ansible-lint (both blocking)
#
# Every `uses:` here is pinned to a 40-character commit SHA with the version in
# a trailing comment. Do not "tidy" them back into tags: until 2026-08-06 the
# four reusable workflows below came from `@main`, so any push to
# github-workflows changed what ran here — with this repo's secrets
# (formerly DOCS_APP_PRIVATE_KEY) and `security-events: write` — without a PR, a review
# or a signal. Tags are no better: they are mutable and can be repointed at any
# commit. The SHAs chosen were the exact commits `@main` and `@v5`/`@v2` already
# resolved to, so pinning changed nothing about what executes.
#
# They are re-resolved automatically by .github/dependabot.yml (github-actions
# ecosystem, weekly, grouped into a single PR). Dependabot rewrites the SHA *and*
# the trailing `# vX.Y.Z` comment, which is why that comment format is
# load-bearing — keep it when editing a pin by hand.
#
# ⚠️ This paragraph asserted the exact opposite until 2026-08-18 ("Nothing bumps
# these automatically. This repo has no dependabot.yml [...] docs/configuration.md
# claims otherwise — it is wrong"). It was itself the stale one, and the docs it
# accused were right: dependabot.yml landed 2026-08-06, the same day these SHAs
# were pinned, and has been opening grouped bump PRs since (2161d07, 285115b).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for every job that does not say otherwise. Without this the
# whole workflow inherited the repository default, which on a repo that has
# never had it narrowed is read/write on all scopes — handed to four jobs that
# shell out to scripts processing external input (the GitHub advisory API in
# traefik-advisories, the GHCR catalog in umbrella-pins). `security` below
# raises what it needs; nothing else here writes anything.
permissions:
  contents: read

jobs:

  # ─── Shell linting ─────────────────────────────────────────────────────────
  shell-ci:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-shell.yml@25f03b7fb1c141105b83b5da0c5c3daf9576afe3 # v0.55.0
    with:
      run-shellcheck: true
      shellcheck-severity: warning
      run-actionlint: true
      actionlint-paths: .github/workflows/
      run-bats: true
      bats-tests-dir: tests/bats/
      bats-submodules: false
      run-docker: false
      run-docs-link-check: true

  # ─── Kubernetes validation + .env.example check ──────────────────────────
  kubernetes:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-kubernetes.yml@25f03b7fb1c141105b83b5da0c5c3daf9576afe3 # v0.55.0
    with:
      run-kubeconform: true
      kubeconform-paths: kubernetes/
      kubeconform-exclude: '.*(kustomization\.yaml|-values\.yaml|-patch\.yaml)'
      kubeconform-include-crds-catalog: true
      run-env-example: true
      env-example-required-keys: >-
        SERVER_IP AGENT_IP DOMAIN EMAIL
        DASHBOARD_PASSWORD
        GRAFANA_DOMAIN GRAFANA_PASSWORD
        KUBECONFIG_CONTEXT K3S_VERSION

  # ─── Secret scanning ──────────────────────────────────────────────────────
  security:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@25f03b7fb1c141105b83b5da0c5c3daf9576afe3 # v0.55.0
    permissions:
      security-events: write
      actions: read
      contents: read
      pull-requests: read
    with:
      run-node-audit: false
      run-python-audit: false
      run-secret-scan: true
      # CodeQL disabled — no supported languages in this repo (Shell/YAML only)
      run-codeql: false

  # ─── Helm chart linting ─────────────────────────────────────────────────────
  # Inline since github-workflows v0.47.0 removed its ci-helm.yml (2026-11,
  # without a replacement): these two jobs do what it did for this repo.
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.17.0
      - name: Lint charts
        run: |
          found=0
          for chart in charts/*/; do
            chart="${chart%/}"
            [[ -f "$chart/Chart.yaml" ]] || continue
            found=1
            echo "::group::helm lint $chart"
            helm lint "$chart"
            echo "::endgroup::"
          done
          if [[ "$found" -eq 0 ]]; then
            echo "::error::no chart found under charts/"
            exit 1
          fi

  # `helm lint` alone does not download dependencies, so the subchart guards
  # (e.g. traefik/templates/requirements.yaml, which rejects any proxy above
  # traefik.io/proxy-max-version) are never rendered. This job fetches the
  # dependencies before `helm template` — that is what catches
  # these failures. Without it, an unrenderable chart was published as 0.13.0,
  # 0.13.1 and 0.13.2 without any CI complaining.
  #
  # platform-deployment is skipped: it is a composition chart with no templates
  # of its own (just NOTES.txt) that pulls its 7 dependencies from GHCR.
  # Rendering it here would validate the registry's contents rather than this
  # repo's source — and its subcharts are already rendered one by one by this
  # loop. That coupling created a circular deadlock on 2026-07-21: the umbrella
  # pinned platform-traefik:0.13.0 (broken), CI failed, and the workflow_run
  # gate prevented publishing the fix. Validating the umbrella belongs to
  # release-charts, after the subcharts are published.
  helm-template:
    name: Helm template dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.17.0
      - name: Template charts
        run: |
          rendered=0
          for chart in charts/*/; do
            chart="${chart%/}"
            [[ -f "$chart/Chart.yaml" ]] || continue
            if [[ "$chart" == "charts/platform-deployment" ]]; then
              echo "⏭️  $chart skipped (rendered by release-charts after publish)"
              continue
            fi
            echo "::group::helm template $chart"
            # `update`, not `build`: build needs every repository registered
            # with `helm repo add` first, update reads the URLs in Chart.yaml.
            # A failed update is only a warning (a registry blip); the render
            # below then fails on the missing dependency anyway.
            helm dependency update "$chart" \
              || echo "::warning::helm dependency update failed for $chart"
            helm template dry-run "$chart" >/dev/null
            echo "✅ $chart renders cleanly"
            echo "::endgroup::"
            rendered=$((rendered + 1))
          done
          if [[ "$rendered" -eq 0 ]]; then
            echo "::error::no chart rendered"
            exit 1
          fi
          echo "✅ $rendered chart(s) rendered"

  # ─── Kyverno policies: executed, not just rendered ────────────────────────
  # A Kyverno release can stop executing a policy type and the chart still
  # renders and lints fine: kyverno.io/v1 ClusterPolicy went that way in 1.20
  # (#126). This evaluates each policy with the Kyverno CLI against
  # tests/fixtures/kyverno/, using the CLI of the release the kyverno subchart
  # actually ships, read from Chart.lock (the vendored .tgz files are
  # gitignored). A subchart bump therefore tests the new engine on its own.
  kyverno-policies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.17.0
      - name: Install the Kyverno CLI the kyverno subchart ships
        run: |
          lock=charts/platform-security/Chart.lock
          chart_version="$(yq -r '.dependencies[] | select(.name == "kyverno") | .version' "$lock")"
          repo="$(yq -r '.dependencies[] | select(.name == "kyverno") | .repository' "$lock")"
          app="$(helm show chart kyverno --repo "$repo" --version "$chart_version" | yq -r '.appVersion')"
          echo "kyverno subchart ${chart_version} ships ${app}"
          asset="kyverno-cli_${app}_linux_x86_64.tar.gz"
          base="https://github.com/kyverno/kyverno/releases/download/${app}"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/checksums.txt"
          # The archive must be listed in the release's checksums, and match.
          grep -q " ${asset}\$" checksums.txt
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
          kyverno version
      - name: Install Bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Evaluate the policies against their fixtures
        env:
          KYVERNO_REQUIRED: "1"   # a missing CLI fails instead of skipping
        run: bats tests/bats/kyverno-policies.bats

  # ─── Resource limits check ────────────────────────────────────────────────
  resource-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Renders every chart with its subcharts (vendored from Chart.lock) and
      # judges each container, the rule of the require-pod-resources policy.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.17.0
      - name: Check every rendered container has requests and a memory limit
        run: ./scripts/check-resource-limits.sh

  # ─── Loop-body trap shape check ───────────────────────────────────────────
  # `[ … ] && cmd` as the last statement of a for/while body silently kills the
  # whole script under `set -e` the day the last iteration's condition happens
  # to be false — the loop inherits that command's exit status as its own.
  # shellcheck does not reason about this. It has shipped for real more than
  # once here (issue #76, then four more scripts fixed 2026-09-07). See
  # scripts/check-loop-trap-shape.sh for the exact shape this catches.
  loop-trap-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for the [ … ] && cmd loop-body trap
        run: ./scripts/check-loop-trap-shape.sh

  # ─── Traefik image check ──────────────────────────────────────────────────
  # helm-template above renders the chart and proves it is *renderable*; it does not
  # say which image comes out. The proxy version is a security decision
  # (GHSA-cxjq <= v3.7.6, GHSA-3ccp <= v3.7.8) that the subchart has already had
  # the means to neutralise silently — versionOverride, or the
  # traefik.io/proxy-max-version guard falling back to the chart's appVersion.
  # This job compares the image actually rendered against the version the chart
  # is meant to deploy: the traefik.image.tag pin when one is set, otherwise the
  # locked subchart's appVersion (no pin since 2026-07-30, upstream caught up).
  traefik-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.17.0
      - name: Verify that the rendered Traefik image matches the expected version
        run: ./scripts/check-traefik-image.sh

  # ─── Rendered image pins (every other chart) ──────────────────────────────
  # The generalisation of `traefik-image` to the charts that pin an image with a
  # `repository:` + `tag:` pair — today platform-vault.
  #
  # Helm lint, kubeconform and the resource-limits check are all satisfied by a
  # pin merely existing, which is how a pin can stop meaning anything without a
  # single job going red. This asserts that the pin reaches the render. What a
  # cluster actually runs is the deploying repository's question, not this one's.
  rendered-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.17.0
      - name: Verify that every image pin reaches the rendered manifests
        run: ./scripts/check-rendered-images.sh

  # ─── Traefik advisory check ───────────────────────────────────────────────
  # The daily `traefik-advisories` workflow catches a version that *goes* stale.
  # It cannot catch a version that is already vulnerable the moment it is
  # written — between the commit and the next 06:12 UTC run there is a window,
  # and that window is exactly where the decision was made. Running the same
  # check here closes it at the point of change.
  #
  # Deliberately not path-filtered: the check is one API call, and now that the
  # proxy version comes from the subchart's appVersion, the set of files that
  # can change it is wider than it looks (values.yaml, Chart.yaml, Chart.lock).
  # Running it always is cheaper than getting that list wrong.
  traefik-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confront the shipped proxy version with the traefik advisories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-traefik-advisories.sh

  # ─── Umbrella pin drift ───────────────────────────────────────────────────
  # platform-deployment pins its 7 subcharts; the umbrella once sat on 0.13.0
  # for three consecutive releases while resolving, rendering and publishing
  # perfectly. The whole repository now shares one version and release-please
  # bumps the pins together with the charts, so this only has to confirm the
  # invariant. It reads the repository, not the registry: the pins of a release
  # PR point at versions that are published only after it merges.
  umbrella-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the umbrella pins with the subcharts in this repository
        run: ./scripts/check-umbrella-pins.sh

  # ─── Ansible playbook validation ──────────────────────────────────────────
  # Nothing in CI read the `ansible/` tree until 2026-08-17, so the provisioning
  # half of this repo had no automated check of any kind while every chart and
  # script had several. The failure mode that motivated this job is specific:
  # role wiring and variable *scope* errors are invisible to YAML linting and
  # only surface when a playbook is run against a real node — i.e. during a
  # provisioning, which is exactly when you least want to discover them. A role
  # renamed but not added to `roles:`, or a default declared in one role and read
  # from a play that never applies it, both parse as perfectly valid YAML.
  #
  # `--syntax-check` resolves the role graph, so it catches precisely that class.
  # It needs an inventory to expand `hosts:`; `-i localhost,` supplies a throwaway
  # one, and the resulting "Could not match supplied host pattern" warnings are
  # expected — the real inventory holds node IPs and is gitignored.
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Galaxy resets connections now and then ("Connection reset by peer",
      # 2026-11-16). A failed install here fails CI on main, and release-charts
      # only runs after a green CI, so one blip can skip a chart release. Retry
      # like release-charts does for `helm dependency update`.
      - name: Install ansible-core and the pinned collections
        run: |
          python3 -m pip install --quiet 'ansible-core==2.21.3'
          for attempt in 1 2 3 4 5; do
            if ansible-galaxy collection install -r ansible/requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::ansible-galaxy collection install failed after 5 attempts"
              exit 1
            fi
            echo "::warning::ansible-galaxy collection install failed (attempt $attempt/5), retrying in 10s"
            sleep 10
          done

      # Runs BEFORE ansible-lint on purpose. ansible-lint's `syntax-check` rules
      # are tagged `unskippable`, so a collection that failed to install does not
      # surface as a dependency problem — it surfaces as
      # "couldn't resolve module/action 'community.general.ufw'" on every task
      # that uses it, which reads as a typo in a file nobody touched. This names
      # the real cause first.
      - name: Verify the collections match the pins
        run: ./scripts/check-ansible-collections.sh

      - name: Syntax-check every playbook
        working-directory: ansible
        run: |
          status=0
          for playbook in playbooks/*.yml; do
            echo "::group::$playbook"
            ansible-playbook --syntax-check -i localhost, "$playbook" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      # The step above runs from ansible/, where ansible.cfg is picked up on its
      # own. Users do not: `task provision:*` and the README / docs/homelab.md
      # commands run from the repository root (or from the config repo that
      # includes the taskfile), where nothing loads ansible.cfg and every role
      # fails to resolve (#121). Replay that exact way of running them.
      - name: Syntax-check every playbook the way users run them (repo root, ANSIBLE_CONFIG)
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          status=0
          for playbook in ansible/playbooks/*.yml; do
            echo "::group::$playbook"
            ansible-playbook --syntax-check -i ansible/inventory.example.yml "$playbook" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      # `--syntax-check` proves each playbook parses and resolves its roles; it
      # says nothing about the ORDER they run in. This asserts the one ordering
      # that is load-bearing: UFW is turned on by the last play, after every rule
      # is registered. Moving that play earlier, or appending a role after it,
      # passes lint and syntax-check and only shows up on an interrupted run
      # against a real node — as a locked-out machine.
      - name: Assert the firewall is still enabled last
        run: ./scripts/check-play-order.sh

      # The inventory holds the nodes' public and private IPs. Until 2026-08-19
      # .gitignore's only Ansible entry was `ansible/*.retry`, so the generated
      # files were untracked but NOT ignored — invisible to every check here and
      # one `git add -A` from being published.
      - name: Assert the generated inventory cannot be committed
        run: ./scripts/check-inventory-ignored.sh

      # Blocking since 2026-08-18. It was advisory for one day, only because the
      # sandbox it was written in could not install ansible-lint and so could not
      # measure the existing debt; gating on an unmeasured finding count would
      # have turned every unrelated PR red. Measured, the tree is clean under one
      # disabled rule — see .ansible-lint for which and why.
      #
      # Runs from `ansible/` so that ansible.cfg applies. From the repo root
      # `roles_path = roles` does not resolve and every playbook reports a bogus
      # `syntax-check[specific]: The role 'common' was not found`.
      #
      # The collections installed above are load-bearing here: the `syntax-check`
      # rules resolve every module, and they are tagged `unskippable`, so a failed
      # collection install surfaces as a wall of "couldn't resolve module/action
      # community.general.ufw" rather than as the dependency problem it is.
      - name: Lint the roles and playbooks
        working-directory: ansible
        run: |
          python3 -m pip install --quiet 'ansible-lint==26.8.0'
          ansible-lint .
