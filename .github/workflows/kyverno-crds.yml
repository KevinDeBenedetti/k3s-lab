# =============================================================================
# Kyverno CRDs — confront the rendered policies with what the cluster accepts
#
# scripts/check-kyverno-crds.sh existed since the 2026-08-13 incident but nothing
# triggered it, so it could only ever catch the *next* outage if someone thought
# to run it by hand — which is the same failure mode it was written to close.
# This workflow is what triggers it.
#
# It asks two questions no offline check can answer, because both are about the
# cluster and not about the repository:
#   1. Is the CRD backing `kyverno.io/v1 ClusterPolicy` present and still serving
#      v1? If not, the Application does not degrade — it fails to sync outright.
#   2. Do the six rendered policies actually EXIST in the cluster? On 2026-08-13
#      they did not: the ArgoCD AppProject `platform` omitted
#      `kyverno.io/ClusterPolicy` from its clusterResourceWhitelist and all six
#      were refused at sync for 32h, while the Application sat OutOfSync/Healthy
#      — green enough to miss.
#
# ⚠️ RUNS ON A SELF-HOSTED RUNNER INSIDE THE CLUSTER, WHICH DOES NOT EXIST YET.
#
# Routing decision, 2026-08-19: the check reaches the API from a GitHub Actions
# runner running IN the cluster (ARC), not from a GitHub-hosted one. ARC is
# already deployed in infra — controller in `arc-systems`, scale sets in `ci` —
# so this needs a fourth scale set registered to THIS repository (a personal
# account has no org-level runners, hence one scale set per repo).
#
# That inverts the network direction and removes a whole class of setup:
#
#   * No KUBECONFIG secret. The runner pod carries a ServiceAccount, so kubectl
#     authenticates in-cluster. There is no kubeconfig to generate, store in a
#     GitHub secret, or rotate. The read-only principal is the SA itself,
#     `kyverno-policy-reader`, bound to a ClusterRole granting `get`/`list` on
#     customresourcedefinitions and kyverno.io/clusterpolicies — nothing else.
#
#   * No firewall change. Nothing reaches in; the runner dials out to GitHub.
#     The API keeps its current exposure, which since 2026-08-17 is governed by
#     the Hetzner Cloud firewall (terraform), NOT by UFW — UFW is disabled on the
#     k3s servers after a `ufw enable` on k3s-mangled netfilter chains cost three
#     hours of downtime.
#
# What is still missing, tracked in infra/TODO.md:
#   platform/arc/runners-k3s-lab-values.yaml   (scale set, runnerScaleSetName: k3s-lab)
#   argocd/applications/arc-runners-k3s-lab.yaml
#   platform/security/manifests/  → SA + ClusterRole + ClusterRoleBinding
#   secret arc-github-k3s-lab-secret (PAT, scope repo)
#
# =============================================================================
name: Kyverno CRDs

on:
  # ⚠️ THE DAILY SCHEDULE IS STILL COMMENTED OUT — uncomment it in the same
  # commit that lands the `k3s-lab` scale set, and not before.
  #
  # The reason changed on 2026-08-19 and got sharper. It used to be that a
  # scheduled run would FAIL for want of a KUBECONFIG. Now that the job targets
  # `runs-on: k3s-lab`, a run with no such runner registered does not fail at
  # all — GitHub leaves it QUEUED until the 6-hour default timeout, every single
  # day. A queued job is even quieter than a red one: nothing goes red, nothing
  # opens an issue, and the check simply never reports.
  #
  # Order matters: scale set first, verify once with workflow_dispatch, then arm
  # the cron.
  #
  # ARMÉ le 2026-08-20, après un dispatch vert de bout en bout
  # (run 32351877024) : runner ARC `k3s-lab` enregistré, SA
  # `kyverno-policy-reader` authentifié in-cluster, 6 policies confrontées au
  # cluster en ~30 s, issue de suivi correctement fermée.
  schedule:
    # Daily, offset from the top of the hour (GitHub saturates :00), and on a
    # different minute than traefik-advisories so the two do not queue together.
    - cron: "37 6 * * *"
  workflow_dispatch:

concurrency:
  group: kyverno-crds
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: "🔒 Kyverno: the rendered policies do not match the cluster"

jobs:
  watch:
    # ARC scale set registered to this repository. Its pod runs the
    # `kyverno-policy-reader` ServiceAccount, which is what gives kubectl its
    # (read-only) identity — see the header.
    runs-on: k3s-lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      # `ubuntu-latest` ships kubectl; the ARC runner image
      # (ghcr.io/actions/actions-runner) does NOT — it is a bare runner, not the
      # GitHub toolcache image. Without this step the job dies on the script's
      # first `kubectl get crd`, and the tracking issue would blame the cluster.
      #
      # Version tracks the cluster's k3s (v1.36.3+k3s1). kubectl supports one
      # minor of skew either way, so this needs revisiting when k3s is upgraded
      # by more than that — not on every patch.
      #
      # The digest is fetched from the same host that serves the binary, so this
      # guards against a truncated or corrupted download, not against a
      # compromised dl.k8s.io. Hardcoding it would be stronger; get the value
      # with `curl -L https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl.sha256`.
      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.36.3
        run: |
          set -euo pipefail
          # Installed into a runner-owned directory and exported via GITHUB_PATH,
          # NOT into /usr/local/bin: the ARC image runs as the unprivileged
          # `runner` user with no sudo, and infra's runner values additionally set
          # `allowPrivilegeEscalation: false`. A `sudo mv` here would fail on the
          # very runner this job targets, while working fine on ubuntu-latest —
          # the worst kind of difference to discover in production.
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "$bindir"
          base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64"
          curl -fsSLo "$bindir/kubectl" "${base}/kubectl"
          curl -fsSLo "$bindir/kubectl.sha256" "${base}/kubectl.sha256"
          (cd "$bindir" && echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status)
          rm -f "$bindir/kubectl.sha256"
          chmod +x "$bindir/kubectl"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/kubectl" version --client

      # Same gap as kubectl, same cause: the ARC runner image ships a bare
      # runner, not the GitHub toolcache image, so it has no `gh` either. Both
      # issue steps below invoke it, and without this they die with
      # `gh: command not found` — exit 127. Observed on the first dispatch runs
      # (2026-08-20, runs 32350755174 and 32351119239): the check itself had
      # already PASSED and the job still went red on the close-the-issue step.
      #
      # That failure mode is worth naming: what breaks is the REPORTING channel,
      # not the check. Had the policies genuinely disagreed, "Open or update the
      # tracking issue" would have failed identically — the job would go red with
      # no issue explaining why. The signal survives, the diagnosis does not.
      #
      # Same constraints as kubectl: no sudo on this image, so install into a
      # runner-owned dir and export via GITHUB_PATH. Checksum verified from the
      # release's own checksums.txt — guards a truncated download, not a
      # compromised github.com.
      - name: Install gh
        env:
          GH_VERSION: 2.97.0
        run: |
          set -euo pipefail
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "$bindir"
          tarball="gh_${GH_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          curl -fsSLo "${RUNNER_TEMP}/${tarball}" "${base}/${tarball}"
          curl -fsSLo "${RUNNER_TEMP}/gh_checksums.txt" "${base}/gh_${GH_VERSION}_checksums.txt"
          # The checksum file lists every artifact of the release, so a bare
          # `--check` fails on the ones we did not download and `--ignore-missing`
          # is the usual answer. But that flag turns "nothing matched" into a
          # pass on some implementations — a verification that verified nothing,
          # which is worse than none because it reads as green. Selecting our one
          # line first makes the assertion explicit: `grep` finds it or the step
          # fails (set -e + pipefail), and sha256sum then checks exactly it.
          (cd "${RUNNER_TEMP}" && grep " ${tarball}\$" gh_checksums.txt | sha256sum --check --status -)
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          mv "${RUNNER_TEMP}/gh_${GH_VERSION}_linux_amd64/bin/gh" "$bindir/gh"
          chmod +x "$bindir/gh"
          # `:?` on an `rm -rf` path: an unset RUNNER_TEMP would otherwise make
          # these expand to /gh_… and delete from the filesystem root (SC2115).
          rm -rf "${RUNNER_TEMP:?}/${tarball}" "${RUNNER_TEMP:?}/gh_checksums.txt" \
                 "${RUNNER_TEMP:?}/gh_${GH_VERSION}_linux_amd64"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/gh" --version

      # No `env: KUBECONFIG` and no secret. The runner pod carries the
      # `kyverno-policy-reader` ServiceAccount, so kubectl picks up in-cluster
      # credentials from the mounted token automatically. If this job ever moves
      # back to a GitHub-hosted runner, it will fail here with "Unable to connect
      # to the server" — which is the correct, loud outcome, not a silent skip.
      - name: Confront the rendered Kyverno policies with the cluster
        id: check
        run: |
          set +e
          ./scripts/check-kyverno-crds.sh 2>&1 | tee /tmp/kyverno.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

          {
            echo "## Kyverno policies vs. cluster"
            echo ""
            echo '```'
            cat /tmp/kyverno.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Open or update the tracking issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body_file=/tmp/issue-body.md
          {
            echo "The Kyverno policies rendered by \`charts/platform-security\` disagree with"
            echo "the cluster, or the cluster could not be read at all."
            echo ""
            echo '```'
            cat /tmp/kyverno.log
            echo '```'
            echo ""
            echo "### What to do"
            echo ""
            echo "**\"no CRD for it in this cluster\"** — the Kyverno engine is not installed, or"
            echo "not at a version serving that apiVersion. Enable it first"
            echo "(\`kyverno.enabled=true\`, \`kyvernoPolicies.enabled=false\` for the first pass),"
            echo "then turn the policies on."
            echo ""
            echo "**\"renders, is installable, and is NOT in the cluster\"** — the policy is being"
            echo "refused upstream rather than being broken. This is the 2026-08-13 failure:"
            echo "check the ArgoCD AppProject's \`clusterResourceWhitelist\` for"
            echo "\`kyverno.io/ClusterPolicy\`, then the Application's sync conditions. The"
            echo "Application can sit \`OutOfSync\`/\`Healthy\` throughout, so it will not alert."
            echo ""
            echo "**\"Unable to connect to the server\"** — nothing is wrong with the policies."
            echo "The job did not reach the API at all, so it ran somewhere without in-cluster"
            echo "credentials: check that it landed on the \`k3s-lab\` ARC runner and that the"
            echo "pod still carries the \`kyverno-policy-reader\` ServiceAccount."
            echo ""
            echo "Reproduce locally, where the kubeconfig already exists:"
            echo "\`./scripts/check-kyverno-crds.sh\`."
            echo ""
            echo "---"
            echo "_Updated by [\`kyverno-crds\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on $(date -u '+%Y-%m-%d %H:%M UTC')._"
          } > "$body_file"

          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
            echo "♻️  Issue #$existing updated"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$body_file" \
              --label security
            echo "🆕 Tracking issue created"
          fi

      - name: Close the tracking issue when the cluster agrees again
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The rendered Kyverno policies are installable and present in the cluster — closed automatically."
            echo "✅ Issue #$existing closed"
          else
            echo "✅ Cluster agrees with the render, no open issue"
          fi

      - name: Fail when the policies disagree with the cluster or it is unreadable
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::Kyverno CRD watch failed — a policy is not installable, not present in the cluster, or the cluster could not be read. See the job summary and the tracking issue."
          exit 1
