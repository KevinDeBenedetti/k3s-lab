# =============================================================================
# Traefik Advisories — watch over the proxy version this repository ships
#
# The Traefik proxy version shipped by charts/platform-traefik is a security
# decision that goes stale **without any commit**. GHSA-3ccp-42pg-hgv6 was
# published 12 days after we froze v3.7.8: nothing in the repository had
# changed, so neither CI nor renovate (which tracks *chart* versions, not proxy
# versions) had any reason to fire. Only a periodic check can see that — hence
# this workflow, independent of any repository activity.
#
# Since 2026-07-30 there is no `traefik.image.tag` pin: the version is the
# subchart's appVersion. That makes this watch *more* necessary, not less — an
# upstream chart lagging behind an advisory goes stale just as silently as a
# frozen pin did, and now nothing in this repo even states the version.
#
# ─── Scope ──────────────────────────────────────────────────────────────────
# This workflow answers exactly ONE question: does the chart *this repository
# publishes* ship a proxy covered by an advisory? It needs no credential, so it
# works in any clone or fork. What a given cluster actually runs is the
# deploying repository's question: a fix here only reaches a cluster once it is
# released **and** its pin is bumped there.
#
# Opens (or updates) a tracking issue when the shipped version becomes
# vulnerable, and closes it again when it is back in the clear.
# =============================================================================
name: Traefik Advisories

on:
  schedule:
    # Daily: the observed exposure window is measured in days, not weeks.
    # 06:12 UTC — offset from the top of the hour, which GitHub saturates.
    - cron: "12 6 * * *"
  workflow_dispatch:

concurrency:
  group: traefik-advisories
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: "🔒 Traefik: the deployed proxy version is covered by an advisory"

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confront the shipped proxy version with the traefik/traefik advisories
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./scripts/check-traefik-advisories.sh 2>&1 | tee /tmp/advisories.log
          status="${PIPESTATUS[0]}"
          set -e

          echo "status=$status" >> "$GITHUB_OUTPUT"

          {
            echo "## Traefik advisory watch"
            echo ""
            echo "The proxy version this repository would publish, confronted with"
            echo "the advisories on \`traefik/traefik\`."
            echo ""
            echo '```'
            cat /tmp/advisories.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Open or update the tracking issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body_file=/tmp/issue-body.md
          {
            echo "The Traefik proxy version this repository would publish is covered by a"
            echo "vulnerable range, or a range could not be evaluated."
            echo ""
            echo '```'
            cat /tmp/advisories.log
            echo '```'
            echo ""
            echo "### What to do"
            echo ""
            echo "1. Prefer bumping the \`traefik\` subchart in \`Chart.yaml\`, if a newer one"
            echo "   already ships the patched proxy — that keeps us on upstream's own version."
            echo "2. Otherwise re-add the \`traefik.image.tag\` pin at the patched version listed"
            echo "   above. **Never \`versionOverride\`** — see the README for why."
            echo "3. Update the comment in \`values.yaml\` **and** the advisory table in"
            echo "   \`charts/platform-traefik/README.md\`."
            echo "4. Verify the render: \`./scripts/check-traefik-image.sh\`."
            echo ""
            echo "If the subchart's \`traefik.io/proxy-max-version\` ceiling blocks the bump,"
            echo "see the procedure in \`charts/platform-traefik/README.md\`."
            echo ""
            echo "### This does not cover deployed clusters"
            echo ""
            echo "A cluster resolves a *published* chart: the fix only reaches it once"
            echo "released **and** pinned in the repository that deploys it."
            echo ""
            echo "---"
            echo "_Updated by [\`traefik-advisories\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on $(date -u '+%Y-%m-%d %H:%M UTC')._"
          } > "$body_file"

          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
            echo "♻️  Issue #$existing updated"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$body_file"
            echo "🆕 Tracking issue created"
          fi

      - name: Close the tracking issue when the shipped version is clean
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The proxy version this repository ships is no longer covered by any known vulnerable range — closed automatically."
            echo "✅ Issue #$existing closed"
          else
            echo "✅ Shipped version is clean, no open issue"
          fi

      - name: Fail when the shipped version is vulnerable
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::Traefik advisory watch failed — the proxy version this repository ships is covered by an advisory, or a range could not be evaluated. See the job summary and the tracking issue."
          exit 1
