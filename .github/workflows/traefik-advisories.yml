# =============================================================================
# Traefik Advisories — watch over the proxy version we deploy
#
# The Traefik proxy version shipped by charts/platform-traefik is a security
# decision that goes stale **without any commit**. GHSA-3ccp-42pg-hgv6 was
# published 12 days after we froze v3.7.8: nothing in the repository had
# changed, so neither CI nor renovate (which tracks *chart* versions, not proxy
# versions) had any reason to fire. Only a periodic check can see that — hence
# this workflow, independent of any repository activity.
#
# Since 2026-07-30 there is no `traefik.image.tag` pin: the version is the
# subchart's appVersion. That makes this watch *more* necessary, not less — an
# upstream chart lagging behind an advisory goes stale just as silently as a
# frozen pin did, and now nothing in this repo even states the version.
#
# Opens (or updates) a tracking issue when that version becomes vulnerable, and
# closes it again when it is back in the clear.
# =============================================================================
name: Traefik Advisories

on:
  schedule:
    # Daily: the observed exposure window is measured in days, not weeks.
    # 06:12 UTC — offset from the top of the hour, which GitHub saturates.
    - cron: "12 6 * * *"
  workflow_dispatch:

concurrency:
  group: traefik-advisories
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: "🔒 Traefik: the deployed proxy version is covered by an advisory"

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Confront the deployed proxy version with the traefik/traefik advisories
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFRA_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
        run: |
          set +e

          # ─── 1. What this repository would deploy ───────────────────────────
          ./scripts/check-traefik-advisories.sh 2>&1 | tee /tmp/advisories.log
          status="${PIPESTATUS[0]}"

          # ─── 2. What the cluster is actually running ────────────────────────
          # A different question, and the two have already disagreed for five
          # days: the repo sat on v3.7.9 and reported clean every morning while
          # production ran v3.7.8 under GHSA-3ccp, because infra still pinned the
          # previous chart. The authoritative answer lives in infra's
          # ApplicationSet, which is a private repo this workflow cannot see
          # without a token — so the check is conditional, and its absence is
          # reported rather than passed over in silence.
          #
          # Since 2026-08-03 this side covers every chart pinned in the
          # ApplicationSet (traefik, cert-manager, external-secrets), not just
          # Traefik: same mechanics, same failure mode, and the first extended
          # run found a live HIGH on cert-manager.
          if [ -n "${INFRA_TOKEN:-}" ]; then
            git clone --depth 1 --quiet \
              "https://x-access-token:${INFRA_TOKEN}@github.com/KevinDeBenedetti/infra.git" \
              /tmp/infra 2>/dev/null
            clone_status=$?

            if [ "$clone_status" -ne 0 ]; then
              echo "::error::could not clone infra — the deployed versions were NOT checked"
              status=1
              echo "could not clone infra" > /tmp/deployed.log
              cp /tmp/deployed.log /tmp/pins.log
            else
              ./scripts/check-deployed-charts.sh \
                --applicationset /tmp/infra/argocd/applicationsets/platform.yaml \
                2>&1 | tee /tmp/deployed.log
              deployed_status="${PIPESTATUS[0]}"
              [ "$deployed_status" -ne 0 ] && status="$deployed_status"

              # ─── 3. How far the pins have drifted from the registry ───────
              # A different question again: sections 1 and 2 ask whether what
              # runs is vulnerable *today*. This one asks whether production is
              # quietly falling behind — the state that let 0.9.1 stay pinned
              # for two weeks after being purged, freezing the proxy on v3.7.1
              # while every other check reported green. Drift is reported in
              # full and only fails past the threshold, because holding a
              # version back is legitimate and a daily red is a signal nobody
              # reads.
              ./scripts/check-deployed-pins.sh \
                --applicationset /tmp/infra/argocd/applicationsets/platform.yaml \
                2>&1 | tee /tmp/pins.log
              pins_status="${PIPESTATUS[0]}"
              [ "$pins_status" -ne 0 ] && status="$pins_status"
            fi
          else
            # Not a pass. The most consequential of the two checks is the one
            # not running, and that has to stay visible on every green run.
            echo "::warning::INFRA_READ_TOKEN is not set — the version RUNNING IN \
          PRODUCTION was not checked, only the one this repo would deploy."
            printf 'SKIPPED — INFRA_READ_TOKEN not set.\n' > /tmp/deployed.log
            cp /tmp/deployed.log /tmp/pins.log
          fi

          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

          {
            echo "## Traefik advisory watch"
            echo ""
            echo "### 1. Version this repository would deploy"
            echo '```'
            cat /tmp/advisories.log
            echo '```'
            echo ""
            echo "### 2. Versions running in production (infra ApplicationSet pins)"
            echo '```'
            cat /tmp/deployed.log
            echo '```'
            echo ""
            echo "### 3. How far those pins trail the registry"
            echo '```'
            cat /tmp/pins.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Open or update the tracking issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body_file=/tmp/issue-body.md
          {
            echo "At least one Traefik proxy version is covered by a vulnerable range, or a"
            echo "range could not be evaluated. **Read both sections** — they answer different"
            echo "questions, and only the second one is about production."
            echo ""
            echo "### 1. Version this repository would deploy"
            echo ""
            echo '```'
            cat /tmp/advisories.log
            echo '```'
            echo ""
            echo "### 2. Versions running in production"
            echo ""
            echo '```'
            cat /tmp/deployed.log
            echo '```'
            echo ""
            echo "### 3. How far those pins trail the registry"
            echo ""
            echo '```'
            cat /tmp/pins.log
            echo '```'
            echo ""
            echo "### What to do"
            echo ""
            echo "**If section 2 is failing, that is the urgent one** — the cluster is serving"
            echo "traffic on a vulnerable component right now. If the *published chart* already"
            echo "ships a patched component, raise that chart's pin in"
            echo "\`infra/argocd/applicationsets/platform.yaml\` and let ArgoCD reconcile."
            echo "Otherwise fix the source first: bump the wrapped subchart in"
            echo "\`charts/<name>/Chart.yaml\`, release, then raise the pin. Check a candidate"
            echo "before pinning it:"
            echo "\`scripts/check-deployed-charts.sh --only <chart> --chart-version <candidate>\`."
            echo ""
            echo "**If only section 3 is failing, nothing is vulnerable right now** — the pins"
            echo "have simply drifted past the staleness threshold. Either raise them in"
            echo "\`infra/argocd/applicationsets/platform.yaml\`, or, if the lag is deliberate,"
            echo "raise \`--max-behind\` in the workflow so the alarm keeps meaning something."
            echo "This is the section that would have caught 0.9.1 sitting pinned for two"
            echo "weeks after it was purged from the registry."
            echo ""
            echo "If section 1 is failing, the fix is in this repository:"
            echo ""
            echo "1. Prefer bumping the \`traefik\` subchart in \`Chart.yaml\`, if a newer one"
            echo "   already ships the patched proxy — that keeps us on upstream's own version."
            echo "2. Otherwise re-add the \`traefik.image.tag\` pin at the patched version listed"
            echo "   above. **Never \`versionOverride\`** — see the README for why."
            echo "3. Update the comment in \`values.yaml\` **and** the advisory table in"
            echo "   \`charts/platform-traefik/README.md\`."
            echo "4. Verify the render: \`./scripts/check-traefik-image.sh\`."
            echo ""
            echo "Note that fixing section 1 does **not** fix section 2: the cluster resolves a"
            echo "published chart, so a repository fix only reaches production once released"
            echo "**and** pinned. That gap ran for five days between 2026-07-27 and 2026-08-01."
            echo ""
            echo "If the subchart's \`traefik.io/proxy-max-version\` ceiling blocks the bump,"
            echo "see the procedure in \`charts/platform-traefik/README.md\`."
            echo ""
            echo "---"
            echo "_Updated by [\`traefik-advisories\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on $(date -u '+%Y-%m-%d %H:%M UTC')._"
          } > "$body_file"

          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
            echo "♻️  Issue #$existing updated"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$body_file" \
              --label security
            echo "🆕 Tracking issue created"
          fi

      - name: Close the tracking issue when the deployed version is clean
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The deployed proxy version is no longer covered by any known vulnerable range — closed automatically."
            echo "✅ Issue #$existing closed"
          else
            echo "✅ Deployed version is clean, no open issue"
          fi

      - name: Fail when the deployed version is vulnerable
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::The deployed Traefik proxy version is covered by an advisory — see the tracking issue."
          exit 1
