# =============================================================================
# Release — Automated versioning via release-please
#
# On push to main: creates/updates a release PR with changelog.
# On merge of release PR: creates a GitHub release + tag.
# Chart publishing is handled by release-charts.yml via workflow_run on CI.
# =============================================================================
name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/release.yml@fece8ead969e822fc15920a07b9db46c01f4673b # v0.25.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # No token secret: release-please runs on GITHUB_TOKEN (needs "Allow GitHub
    # Actions to create and approve pull requests"; CI on the release PR waits
    # for "Approve workflows to run").
