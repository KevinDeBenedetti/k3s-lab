# =============================================================================
# prek.toml — git hook configuration (https://prek.j178.dev)
# prek is a faster, dependency-free alternative to pre-commit (written in Rust)
#
# Install prek:   brew install j178/tap/prek
# Install hooks:  prek install       (run once after cloning)
# Run all:        prek run --all-files    (or: make lint)
# Run staged:     prek run
# Update revs:    Renovate does it, with the prek manager of the shared preset
#                 renovate.json extends: each `rev` it moves carries a
#                 `# renovate: datasource=… depName=…` comment on the line above.
#                 A hook added without one is never updated.
# =============================================================================

minimum_prek_version = "0.3.0"
fail_fast = false
default_install_hook_types = ["pre-commit", "pre-push"]

# ─── General file hygiene ───────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
# renovate: datasource=github-tags depName=pre-commit/pre-commit-hooks
rev = "v5.0.0"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  # --allow-multiple-documents: Kubernetes files use multiple --- separated docs
  # exclude Helm values files that embed Go template syntax ({{ }})
  { id = "check-yaml", args = ["--allow-multiple-documents"], exclude = "^(kubernetes/.*/.*-values\\.yaml|charts/.*/templates/.*\\.yaml)$" },
  { id = "check-merge-conflict" },
  { id = "check-executables-have-shebangs" },
  # exclude Jinja2 templates: the shebang is for the rendered output, not the .j2 source
  { id = "check-shebang-scripts-are-executable", exclude = "\\.j2$" },
  { id = "detect-private-key" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

# ─── Shell script linting ───────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
# loose: the default (semver-coerced) drops the 4th number, so v0.10.0.2 would
# not count as newer than v0.10.0.1.
# renovate: datasource=github-tags depName=shellcheck-py/shellcheck-py versioning=loose
rev = "v0.10.0.1"
hooks = [
  { id = "shellcheck", args = ["--severity=warning", "--shell=bash"], files = "\\.sh$" },
]

# ─── GitHub Actions workflow linting ────────────────────────────────────────
[[repos]]
repo = "https://github.com/rhysd/actionlint"
# renovate: datasource=github-tags depName=rhysd/actionlint
rev = "v1.7.10"
hooks = [
  { id = "actionlint" },
]

# ─── Renovate config validation ─────────────────────────────────────────────
# Nothing else here reads renovate.json: this checks it against Renovate's
# schema (unknown or deprecated options, broken regexes) before a commit, not
# on the bot's next run, which reads the config from main only. --no-global:
# validate it as the repository config it is, not as a self-hosted global one.
[[repos]]
repo = "https://github.com/renovatebot/pre-commit-hooks"
# renovate: datasource=github-tags depName=renovatebot/pre-commit-hooks
rev = "44.257.9"
hooks = [
  { id = "renovate-config-validator", args = ["--strict", "--no-global"] },
]

# ─── Docs link safety ────────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/KevinDeBenedetti/github-workflows"
# renovate: datasource=github-tags depName=KevinDeBenedetti/github-workflows
rev = "v0.55.0"
hooks = [
  { id = "check-docs-links" },
]

# ─── Local hooks ────────────────────────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "kubeconform"
name = "kubeconform — Kubernetes schema validation"
# Validates manifests against official Kubernetes API schemas (no cluster needed).
# Install: brew install kubeconform
language = "system"
entry = "bash -c 'which kubeconform >/dev/null 2>&1 && kubeconform -strict -summary -schema-location default -schema-location \"https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json\" \"$@\" || echo \"⚠️  kubeconform not installed — skipping (brew install kubeconform)\"' --"
files = "^kubernetes/.*\\.yaml$"
# Same exclusions as the CI job (ci.yml kubeconform-exclude): a -patch.yaml
# file is a kustomize patch (app-base's is a JSON 6902 list), not a manifest.
exclude = ".*(kustomization\\.yaml|-values\\.yaml|-patch\\.yaml)$"
pass_filenames = true

[[repos.hooks]]
id = "no-env-commit"
name = "Block .env commit"
# Belt-and-suspenders on top of .gitignore — refuse to commit real secrets.
language = "system"
entry = "bash -c 'for f in \"$@\"; do echo \"❌ Refusing to commit $f — contains secrets\"; exit 1; done' --"
files = "^\\.env$"
pass_filenames = true
