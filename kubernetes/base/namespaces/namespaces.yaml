# =============================================================================
# Namespace definitions with Pod Security Standards
# Consumed via Kustomize — override or add namespaces in your overlay.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    kubernetes.io/metadata.name: apps
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: k3s-lab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Workloads in `apps` get no API token unless they ask for one (CIS 5.1.5/5.1.6):
# a workload that needs the API uses its own ServiceAccount (see the app-base
# component). Only `apps` is covered here — the platform namespaces run
# third-party charts that are not audited for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: apps
automountServiceAccountToken: false

