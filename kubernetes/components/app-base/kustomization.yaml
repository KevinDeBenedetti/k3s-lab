# =============================================================================
# app-base Component — Reusable base for all apps
#
# Provides:
# - Standard labels (app.kubernetes.io/*, managed-by)
# - Service & ServiceAccount templates
# - Namespace label selector
#
# - Security hardening of every Deployment in the app (deployment-patch.yaml):
#   the first container runs non-root, read-only, without privilege
#   escalation or capabilities, under the RuntimeDefault seccomp profile, and
#   the pod mounts no service-account token. The app's own patches run after
#   the component's, so an app can still set runAsUser, mount an emptyDir for
#   /tmp, or turn the token back on.
#
# Usage in app kustomization.yaml:
#   components:
#     - https://github.com/KevinDeBenedetti/k3s-lab//kubernetes/components/app-base?ref=vX.Y.Z
#   resources:
#     - deployment.yaml      # your app-specific deployment
#   patchesStrategicMerge:
#     - deployment-patch.yaml     # override resources, volumes, etc.
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Resources used by this component (templates)
resources:
  - service.yaml
  - serviceaccount.yaml

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment

# Labels applied to ALL objects (including Deployments, Services, etc.)
labels:
  - pairs:
      app.kubernetes.io/managed-by: "kustomize"
    # app.kubernetes.io/name will be set per-app
    # app.kubernetes.io/version will be set per-app
