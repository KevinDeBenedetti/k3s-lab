# Security hardening applied by the app-base component to every Deployment of
# the app (see kustomization.yaml: `patches:` with `target: kind: Deployment`).
#
# A JSON 6902 patch rather than a strategic-merge one: strategic merge matches
# containers by name, so it would only reach a container named exactly like
# the patch's, and add a second, image-less container to every other app.
# This one sets the securityContext of the FIRST container, whatever its name.
#
# It replaces that container's securityContext as a whole: set runAsUser /
# runAsGroup (or relax a field) in the app's own patch, which runs after the
# component's.
- op: add
  path: /spec/template/spec/automountServiceAccountToken
  value: false
- op: add
  path: /spec/template/spec/containers/0/securityContext
  value:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
