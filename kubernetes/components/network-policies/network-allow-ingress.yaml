# Allow ingress from the ingress controller: Traefik, installed by
# charts/platform-traefik in the `ingress` namespace (kube-system kept for
# k3s's own load-balancer pods).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-controller
  labels:
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}  # Applies to all pods in this namespace
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080      # Common app HTTP port
        - protocol: TCP
          port: 80        # HTTP fallback
        - protocol: TCP
          port: 443       # HTTPS
