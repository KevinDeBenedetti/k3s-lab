# Allow DNS egress to kube-system for name resolution

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}  # Applies to all pods in this namespace
  policyTypes:
    - Egress
  egress:
    # Allow DNS to kube-system. `kubernetes.io/metadata.name` is the label
    # Kubernetes sets on every namespace; nothing sets a bare `name:` one.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53        # DNS UDP
        - protocol: TCP
          port: 53        # DNS TCP
    # Allow HTTPS to any pod in the cluster and to the outside world.
    # A namespaceSelector only ever matches pods; addresses outside the
    # cluster need an ipBlock.
    - to:
        - namespaceSelector: {}  # any pod, any namespace
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
